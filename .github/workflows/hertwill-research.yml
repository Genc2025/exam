name: Hertwill Product Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research-hertwill.mjs'
      - '.github/workflows/hertwill-research.yml'

permissions:
  contents: write

concurrency:
  group: hertwill-product-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Query Hertwill Public API
        run: node scripts/research-hertwill.mjs

      - name: Commit research snapshot
        run: |
          git config user.name "virello-hertwill-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hertwill-research.json
          if git diff --cached --quiet; then
            echo "No Hertwill research changes."
            exit 0
          fi
          git commit -m "Refresh Hertwill product research"
          git pull --rebase origin main
          git push origin main
