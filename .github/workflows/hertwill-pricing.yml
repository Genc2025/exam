name: Hertwill Pricing Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-hertwill-pricing.mjs'
      - '.github/workflows/hertwill-pricing.yml'

permissions:
  contents: write

concurrency:
  group: hertwill-pricing
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify authenticated Hertwill economics
        id: pricing
        env:
          HERTWILL_API_KEY: ${{ secrets.HERTWILL_API_KEY }}
        run: |
          if [ -z "${HERTWILL_API_KEY:-}" ]; then
            echo "HERTWILL_API_KEY is not configured; pricing verification skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          node scripts/verify-hertwill-pricing.mjs
      - name: Commit priced shortlist
        if: steps.pricing.outputs.configured == 'true'
        run: |
          git config user.name "virello-hertwill-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hertwill-priced-shortlist.json
          git commit -m "Verify Hertwill Germany economics" || exit 0
          git pull --rebase origin main
          git push origin main
