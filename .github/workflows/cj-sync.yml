name: Sync CJ Europe Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-cj-europe-v4.mjs'
      - 'scripts/enrich-cj-economics.mjs'
      - 'scripts/normalize-catalog-mode.mjs'
      - 'data/catalog-config.json'
      - '.github/workflows/cj-sync.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: cj-europe-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate scripts
        run: |
          node --check scripts/sync-cj-europe-v4.mjs
          node --check scripts/enrich-cj-economics.mjs
          node --check scripts/normalize-catalog-mode.mjs

      - name: Sync verified CJ Europe catalog
        id: cj
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_API_BASE: https://developers.cjdropshipping.com/api2.0/v1
          CJ_API_DELAY_MS: 2600
          USD_TO_EUR_RATE: ${{ vars.USD_TO_EUR_RATE }}
        run: |
          if [ -z "${CJ_API_KEY:-}" ]; then
            echo "CJ_API_KEY is not configured; catalog sync skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          node scripts/sync-cj-europe-v4.mjs

      - name: Enrich demo economics with CJ freight
        if: steps.cj.outputs.configured == 'true'
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_API_BASE: https://developers.cjdropshipping.com/api2.0/v1
          CJ_API_DELAY_MS: 2600
        run: node scripts/enrich-cj-economics.mjs

      - name: Normalize live storefront mode
        if: steps.cj.outputs.configured == 'true'
        run: node scripts/normalize-catalog-mode.mjs

      - name: Validate generated Europe catalog
        if: steps.cj.outputs.configured == 'true'
        run: |
          node - <<'NODE'
          const feed = require('./data/products.json');
          const config = require('./data/catalog-config.json');
          const allowed = new Set((config.warehouseCountries || []).map(v => String(v).toUpperCase()));
          if (feed.source !== 'cj') throw new Error('Catalog source must be cj.');
          if (!Array.isArray(feed.products)) throw new Error('Catalog products must be an array.');
          if (feed.mode !== 'live-api') throw new Error('Storefront mode must be live-api.');
          if (feed.selection?.warehouseRegion !== 'EUROPE') throw new Error('Catalog must be Europe-wide.');
          if (!feed.economicsSummary) throw new Error('Economics summary missing.');
          for (const product of feed.products) {
            if (product.verifiedStock !== true) throw new Error(`Unverified stock: ${product.sku}`);
            if (!(Number(product.stock) >= Number(config.minStock || 1))) throw new Error(`Insufficient stock: ${product.sku}`);
            if (!Array.isArray(product.warehouses) || product.warehouses.length === 0) throw new Error(`Missing warehouse: ${product.sku}`);
            if (product.warehouses.some((warehouse) => !allowed.has(String(warehouse.countryCode).toUpperCase()) || warehouse.verified !== true)) {
              throw new Error(`Disallowed or unverified warehouse: ${product.sku}`);
            }
            if (!allowed.has(String(product.primaryWarehouse).toUpperCase())) throw new Error(`Invalid primary warehouse: ${product.sku}`);
            if (product.sellReady !== false) throw new Error(`sellReady must stay false before final compliance checks: ${product.sku}`);
          }
          console.log(`Validated ${feed.products.length} CJ verified European-warehouse products; freight economics ${feed.economicsSummary.freightVerified}/${feed.economicsSummary.processed}.`);
          NODE

      - name: Commit catalog changes
        if: steps.cj.outputs.configured == 'true'
        run: |
          if git diff --quiet -- data/products.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "virello-cj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json
          git commit -m "Sync CJ Europe catalog with demo economics"
          git pull --rebase origin main
          git push origin main
