name: Sync CJ EU Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: cj-eu-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync verified CJ EU catalog
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_API_BASE: https://developers.cjdropshipping.com/api2.0/v1
        run: node scripts/sync-cj.mjs

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- data/products.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "virello-cj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json
          git commit -m "Sync verified CJ EU catalog"
          git push
