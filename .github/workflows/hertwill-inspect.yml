name: Hertwill Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-hertwill-research.mjs'
      - '.github/workflows/hertwill-inspect.yml'

permissions:
  contents: write

concurrency:
  group: hertwill-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inspect Hertwill snapshot
        run: node scripts/inspect-hertwill-research.mjs
      - name: Commit compact inspection
        run: |
          git config user.name "virello-hertwill-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hertwill-inspect.json
          git commit -m "Inspect Hertwill product fields" || exit 0
          git pull --rebase origin main
          git push origin main
