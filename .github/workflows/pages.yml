name: Deploy Ascend Prep V20

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BUILD_VERSION: V20

concurrency:
  group: pages-v20
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify V20 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Ascend Prep V20' index.html
          test -f v20.css
          echo "Deploying commit: $GITHUB_SHA"
          echo "Verified build: $BUILD_VERSION"

      - name: Prepare clean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html _site/
          cp app.js _site/
          cp ./*.css _site/
          cp ./*.js _site/
          touch _site/.nojekyll
          printf '%s\n' "$BUILD_VERSION $GITHUB_SHA" > _site/build.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload V20 artifact only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy V20
        id: deployment
        uses: actions/deploy-pages@v4
