name: Deploy Miranda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-miranda
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify Miranda V9 build
        run: |
          set -euo pipefail
          grep -q 'fresh.css?v=9' index.html
          grep -q 'ultra.css?v=9' index.html
          grep -q 'premium.css?v=9' index.html
          grep -q 'fresh.js?v=9' index.html
          grep -q 'diet.js?v=9' index.html
          grep -q 'ultra.js?v=9' index.html
          grep -q 'premium.js?v=9' index.html
          grep -q 'Meal Planner' ultra.js
          grep -q 'Cooking mode' ultra.js
          grep -q 'Pantry' premium.js
          grep -q 'Baby Safety Center' premium.js
          grep -q 'serviceWorker' premium.js
          test -f manifest.webmanifest
          test -f sw.js

      - name: Build isolated site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html fresh.css fresh.js diet.js ultra.css ultra.js premium.css premium.js manifest.webmanifest sw.js _site/
          touch _site/.nojekyll
          printf 'MIRANDA-PREMIUM-V9 %s\n' "$GITHUB_SHA" > _site/build.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload isolated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Miranda
        id: deployment
        uses: actions/deploy-pages@v4
