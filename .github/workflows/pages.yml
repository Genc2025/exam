name: Deploy Virello Store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-virello
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify storefront assets
        run: |
          set -euo pipefail
          test -f index.html
          test -f src/store.js
          test -f data/products.json
          test -f data/catalog-config.json

      - name: Build isolated storefront
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/src _site/data
          cp index.html _site/
          cp src/store.js _site/src/
          cp data/products.json _site/data/
          touch _site/.nojekyll
          printf 'VIRELLO %s\n' "$GITHUB_SHA" > _site/build.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy storefront
        id: deployment
        uses: actions/deploy-pages@v4
