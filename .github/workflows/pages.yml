name: Deploy Fresh Ascend Prep

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-fresh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify fresh rebuild
        run: |
          set -euo pipefail
          grep -q 'fresh.css?v=1' index.html
          grep -q 'fresh.js?v=1' index.html
          test -f fresh.css
          test -f fresh.js

      - name: Build isolated site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html fresh.css fresh.js _site/
          touch _site/.nojekyll
          printf 'FRESH-V1 %s\n' "$GITHUB_SHA" > _site/build.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload isolated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy fresh build
        id: deployment
        uses: actions/deploy-pages@v4
