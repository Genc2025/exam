name: Deploy Virello Store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-virello
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify CJ storefront assets
        run: |
          set -euo pipefail
          test -f index.html
          test -f src/store-cj.js
          test -f src/store-cj.css
          test -f src/economics-ui.js
          test -f src/economics-ui.css
          test -f scripts/sync-cj-europe-v4.mjs
          test -f data/products.json
          test -f data/catalog-config.json
          node --check src/store-cj.js
          node --check src/economics-ui.js
          node --check scripts/sync-cj-europe-v4.mjs
          node - <<'NODE'
          const fs = require('fs');
          const feed = JSON.parse(fs.readFileSync('data/products.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('data/catalog-config.json', 'utf8'));
          if (feed.source !== 'cj') throw new Error('Catalog source must be cj.');
          if (config.market !== 'DE') throw new Error('Market must be DE.');
          if (config.warehouseRegion !== 'EUROPE') throw new Error('Warehouse region must be EUROPE.');
          if (!Array.isArray(config.warehouseCountries) || config.warehouseCountries.length < 10) throw new Error('Europe warehouse country set is incomplete.');
          if (!(Number(config.minStock) >= 1)) throw new Error('minStock must be at least 1.');
          console.log(`Static CJ Europe storefront validation passed with ${feed.products?.length || 0} products.`);
          NODE

      - name: Build isolated storefront
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/src _site/data
          cp index.html _site/
          cp src/store-cj.js _site/src/
          cp src/store-cj.css _site/src/
          cp src/economics-ui.js _site/src/
          cp src/economics-ui.css _site/src/
          cp data/products.json _site/data/
          touch _site/.nojekyll
          printf 'VIRELLO %s\n' "$GITHUB_SHA" > _site/build.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy storefront
        id: deployment
        uses: actions/deploy-pages@v4
