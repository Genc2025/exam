<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CRAVE — Receta</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:90px;background:#fff}.top{position:sticky;top:0;z-index:10;background:#fff;padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:950}.logo span{color:#ef315c}.count{font-size:12px;font-weight:800;background:#f3f3f3;padding:8px 11px;border-radius:99px}.hero{padding:5px 20px}.hero small,.meta{color:#777}.hero h1{font-size:30px;line-height:1.08;margin:6px 0 18px}.search{background:#f4f4f4;border-radius:14px;padding:13px 15px;display:flex;gap:10px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:15px}.chips{display:flex;gap:9px;overflow:auto;padding:17px 20px 9px}.chip{white-space:nowrap;border:1px solid #e6e6e6;background:#fff;border-radius:99px;padding:9px 14px;font-weight:700}.chip.active{background:#171717;color:#fff}.section{padding:14px 20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionhead h2{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}.card{cursor:pointer}.cardimg{height:145px;border-radius:17px;background-size:cover;background-position:center}.card h3{font-size:15px;line-height:1.25;margin:8px 2px 4px}.meta{font-size:12px}.sheet{position:fixed;inset:0;background:#0009;z-index:30;display:none;align-items:flex-end;justify-content:center}.sheetbox{width:min(620px,100%);background:#fff;border-radius:25px 25px 0 0;padding:22px;max-height:90vh;overflow:auto}.sheetbox img{width:100%;height:260px;object-fit:cover;border-radius:18px}.sheetbox h2{font-size:27px;margin:12px 0 6px}.sheetbox h3{margin-top:25px}.sheetbox li{margin:12px 0;line-height:1.55}.close{float:right;position:sticky;top:0;border:0;background:#eee;width:38px;height:38px;border-radius:50%;font-size:20px}.empty{grid-column:1/-1;text-align:center;padding:45px;color:#888}@media(max-width:390px){.cardimg{height:125px}}</style></head><body><main class="app"><header class="top"><div class="logo">CRA<span>VE</span></div><div class="count" id="count">Duke ngarkuar…</div></header><section class="hero"><small>Receta në shqip</small><h1>Çfarë dëshiron<br>të gatuash sot?</h1><div class="search">⌕ <input id="search" placeholder="Kërko recetë ose përbërës..."></div></section><div class="chips" id="chips"></div><section class="section"><div class="sectionhead"><h2>Të gjitha recetat</h2><span class="meta" id="shown"></span></div><div class="grid" id="cards"></div></section></main><div class="sheet" id="sheet"><div class="sheetbox"><button class="close" id="close">×</button><img id="detailImg"><h2 id="detailTitle"></h2><div class="meta" id="detailMeta"></div><h3>Përbërësit</h3><ul id="ingredients"></ul><h3>Përgatitja profesionale, hap pas hapi</h3><ol id="steps"></ol></div></div><script src="recipes.js?v=4"></script><script src="recipes-21-60.js?v=4"></script><script>const recipes=[...(window.RECIPES||[]),...(window.RECIPES_21_60||[])];let category='Të gjitha';const cards=document.getElementById('cards'),search=document.getElementById('search'),sheet=document.getElementById('sheet'),chips=document.getElementById('chips');count.textContent=recipes.length+' receta';const cats=['Të gjitha',...new Set(recipes.map(r=>r.category))];chips.innerHTML=cats.map((c,i)=>`<button class="chip ${i?'':'active'}" data-cat="${c}">${c}</button>`).join('');function meta(r){return `${r.time} · ${r.difficulty} · ${r.servings} porcione`}function openRecipe(i){const r=recipes[i];detailImg.src=r.img;detailTitle.textContent=r.title;detailMeta.textContent=meta(r);ingredients.innerHTML=r.ingredients.map(v=>`<li>${v}</li>`).join('');steps.innerHTML=r.steps.map(v=>`<li>${v}</li>`).join('');sheet.style.display='flex';document.body.style.overflow='hidden'}function render(){const q=search.value.trim().toLowerCase();const list=recipes.filter(r=>(category==='Të gjitha'||r.category===category)&&(!q||(r.title+' '+r.category+' '+r.ingredients.join(' ')).toLowerCase().includes(q)));shown.textContent=list.length+' rezultate';cards.innerHTML=list.length?list.map(r=>`<article class="card" onclick="openRecipe(${recipes.indexOf(r)})"><div class="cardimg" style="background-image:url('${r.img}')"></div><h3>${r.title}</h3><div class="meta">${meta(r)}</div></article>`).join(''):'<div class="empty">Nuk u gjet asnjë recetë.</div>'}chips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;category=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};search.oninput=render;close.onclick=()=>{sheet.style.display='none';document.body.style.overflow=''};sheet.onclick=e=>{if(e.target===sheet)close.onclick()};render();</script></body></html>
