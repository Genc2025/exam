<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FITPRO — Animated Upper Body</title><style>*{box-sizing:border-box}body{margin:0;background:#050a0d;color:#f7f8f8;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#071015,#030709);padding-bottom:88px}.top{padding:18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950;font-style:italic}.logo b{color:#a9ef27}.pro{border:1px solid #344149;border-radius:12px;padding:8px 12px;font-weight:800}.hero{margin:0 16px 16px;padding:22px;border-radius:24px;background:radial-gradient(circle at 80% 20%,#27380f,#0b1418 52%);border:1px solid #1c292f}.eyebrow{color:#a9ef27;font-weight:800;font-size:12px;letter-spacing:1px}.hero h1{font-size:36px;line-height:.98;margin:8px 0}.hero p,.meta{color:#96a0a5}.section{padding:8px 16px}.head{display:flex;justify-content:space-between;align-items:end;margin:10px 0 13px}.head h2{margin:0;font-size:21px}.head span{color:#7f8b90;font-size:12px}.muscles{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.chip{border:1px solid #27343a;background:#0d1519;color:#cbd1d3;border-radius:99px;padding:9px 14px;white-space:nowrap;font-weight:750}.chip.active{background:#a9ef27;color:#081005;border-color:#a9ef27}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0c1317;border:1px solid #1c282e;border-radius:18px;overflow:hidden;cursor:pointer}.visual{height:175px;background:#fff;position:relative;overflow:hidden}.visual img{width:100%;height:100%;object-fit:contain}.tag{position:absolute;left:9px;top:9px;background:#a9ef27;color:#071005;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:900}.live{position:absolute;right:8px;bottom:7px;background:#071005e8;color:#a9ef27;padding:5px 8px;border-radius:8px;font-size:9px;font-weight:900}.cardbody{padding:12px}.card h3{font-size:15px;margin:0 0 5px}.meta{font-size:11px;line-height:1.35}.start{margin-top:10px;width:100%;border:0;border-radius:10px;padding:9px;background:#172126;color:#a9ef27;font-weight:850}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:72px;background:#081014ee;backdrop-filter:blur(15px);border-top:1px solid #1d292f;display:flex;justify-content:space-around;align-items:center;z-index:20}.nav{background:none;border:0;color:#78858a;font-size:11px}.nav b{display:block;font-size:20px}.nav.active{color:#a9ef27}.sheet{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:flex-end;justify-content:center}.panel{width:min(620px,100%);max-height:94vh;overflow:auto;background:#091115;border-radius:26px 26px 0 0;padding:20px}.close{float:right;width:38px;height:38px;border:0;border-radius:50%;background:#182226;color:#fff;font-size:20px;position:relative;z-index:2}.gifhero{height:330px;background:#fff;border-radius:20px;overflow:hidden;clear:both;margin-top:10px}.gifhero img{width:100%;height:100%;object-fit:contain}.panel h2{font-size:28px;margin:17px 0 5px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{background:#172126;padding:7px 10px;border-radius:99px;color:#b8c0c3;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#10191d;border-radius:13px;padding:12px 5px;text-align:center}.stat small{display:block;color:#7f8a8f}.musclebox{padding:15px;background:#10191d;border-radius:16px;margin:15px 0}.musclebox b{color:#a9ef27}.steps{padding:0;list-style:none;counter-reset:x}.steps li{counter-increment:x;display:flex;gap:12px;margin:15px 0;line-height:1.45;color:#d9dddf}.steps li:before{content:counter(x);flex:0 0 28px;height:28px;border:1px solid #a9ef27;color:#a9ef27;border-radius:50%;display:grid;place-items:center;font-weight:900}.primary{width:100%;border:0;border-radius:14px;background:#a9ef27;color:#081005;padding:15px;font-size:15px;font-weight:950;margin-top:10px}.credit{text-align:center;color:#68757a;font-size:10px;margin:22px}@media(max-width:390px){.visual{height:150px}.gifhero{height:285px}}</style></head><body><main class="app"><header class="top"><div class="logo"><b>✣</b> FITPRO</div><div class="pro">♛ PRO</div></header><section class="hero"><div class="eyebrow">ANIMATED UPPER BODY</div><h1>Shiko lëvizjen.<br>Mëso teknikën.</h1><p>Demonstrime GIF që përsëriten automatikisht.</p></section><section class="section"><div class="head"><h2>Grupet muskulore</h2><span>Upper Body</span></div><div class="muscles" id="filters"></div></section><section class="section"><div class="head"><h2>Ushtrimet</h2><span id="resultCount"></span></div><div class="grid" id="grid"></div></section><div class="credit">Exercise media powered by ExerciseDB / AscendAPI · prototype demo</div></main><nav class="bottom"><button class="nav active"><b>⌂</b>Home</button><button class="nav"><b>▣</b>Workouts</button><button class="nav"><b>◉</b>Exercises</button><button class="nav"><b>▥</b>Progress</button></nav><div class="sheet" id="sheet"><div class="panel"><button class="close" id="close">×</button><div class="gifhero"><img id="demoGif" alt="Animated exercise demonstration"></div><h2 id="title"></h2><div class="badges" id="badges"></div><div class="stats"><div class="stat"><small>Sete</small><b id="sets"></b></div><div class="stat"><small>Përsëritje</small><b id="reps"></b></div><div class="stat"><small>Pushim</small><b id="rest"></b></div></div><div class="musclebox"><small>Muskujt kryesorë</small><br><b id="worked"></b></div><h3>Teknika</h3><ol class="steps" id="steps"></ol><button class="primary" id="complete">✓ Përfundo setin</button></div></div><script>const fallback='https://static.exercisedb.dev/media/EIeI8Vf.gif';const data=[{name:'Bench Press',query:'barbell bench press',group:'Gjoks',muscles:'Gjoks · Triceps · Shpatulla',sets:'3–4',reps:'6–12',rest:'60–90s',gif:fallback,steps:['Stabilizo shpatullat prapa dhe poshtë.','Ule shufrën me kontroll drejt kraharorit.','Mbaji kyçet stabile dhe shputat në dysheme.','Shtyje shufrën lart pa humbur pozicionin e trungut.']},{name:'Incline Dumbbell Press',query:'incline dumbbell press',group:'Gjoks',muscles:'Gjoksi i sipërm · Triceps · Shpatulla',sets:'3',reps:'8–12',rest:'60–90s',steps:['Vendose bankën në pjerrësi të moderuar.','Nis me hantelat anash kraharorit.','Shtyji lart me kontroll.','Uli ngadalë në pozicionin fillestar.']},{name:'Pull-Up',query:'pull up',group:'Shpinë',muscles:'Lats · Biceps · Shpina e sipërme',sets:'3–4',reps:'5–10',rest:'90s',steps:['Kap shufrën dhe stabilizo shpatullat.','Tërhiq bërrylat poshtë dhe trupin drejt shufrës.','Mos përdor lëkundje të panevojshme.','Ulu me kontroll në zgjatje.']},{name:'Seated Cable Row',query:'seated cable row',group:'Shpinë',muscles:'Shpina e mesme · Lats · Biceps',sets:'3',reps:'8–12',rest:'60–90s',steps:['Mbaje shtyllën neutrale.','Tërhiq shpatullat prapa.','Sill dorezën drejt brinjëve.','Ktheje peshën ngadalë.']},{name:'Overhead Press',query:'barbell overhead press',group:'Shpatulla',muscles:'Deltoids · Triceps',sets:'3–4',reps:'6–10',rest:'90s',steps:['Tendose trungun.','Nis me peshën pranë pjesës së sipërme të kraharorit.','Shtyje vertikalisht mbi kokë.','Ule me kontroll.']},{name:'Lateral Raise',query:'dumbbell lateral raise',group:'Shpatulla',muscles:'Deltoid lateral',sets:'3',reps:'12–15',rest:'45–60s',steps:['Mbaji bërrylat lehtë të përkulur.','Ngriji krahët anash.','Ndalo rreth nivelit të shpatullave.','Uli ngadalë.']},{name:'Biceps Curl',query:'dumbbell biceps curl',group:'Krahë',muscles:'Biceps · Brachialis',sets:'3',reps:'10–15',rest:'45–60s',steps:['Mbaji bërrylat pranë trungut.','Përkuli bërrylat pa lëvizur shpatullat.','Shtrëngo bicepsin lart.','Uli peshat me kontroll.']},{name:'Triceps Pushdown',query:'triceps pushdown',group:'Krahë',muscles:'Triceps',sets:'3',reps:'10–15',rest:'45–60s',steps:['Mbaji bërrylat pranë trungut.','Shtyje dorezën poshtë.','Zgjati bërrylat plotësisht pa lëvizur shpatullat.','Kthehu ngadalë.']}];async function findGif(x){if(x.gif)return x.gif;try{const u='https://oss.exercisedb.dev/api/v1/exercises/search?q='+encodeURIComponent(x.query);const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();const a=j.data||j.results||[];const hit=a.find(v=>v.gifUrl)||a[0];if(hit&&hit.gifUrl){x.gif=hit.gifUrl;return x.gif}}catch(e){}return null}async function loadAll(){await Promise.all(data.map(findGif));render()}let filter='Të gjitha';const filterNames=['Të gjitha','Gjoks','Shpinë','Shpatulla','Krahë'];const grid=document.getElementById('grid'),sheet=document.getElementById('sheet');function renderFilters(){filters.innerHTML=filterNames.map(x=>`<button class="chip ${x===filter?'active':''}" onclick="filter='${x}';renderFilters();render()">${x}</button>`).join('')}function render(){const list=data.filter(x=>filter==='Të gjitha'||x.group===filter);resultCount.textContent=list.length+' ushtrime';grid.innerHTML=list.map(x=>`<article class="card" onclick="openEx('${x.name}')"><div class="visual">${x.gif?`<img src="${x.gif}" alt="${x.name}" loading="lazy">`:'<div style="height:100%;display:grid;place-items:center;color:#555">Duke ngarkuar…</div>'}<span class="tag">${x.group}</span><span class="live">● ANIMATED</span></div><div class="cardbody"><h3>${x.name}</h3><div class="meta">${x.muscles}</div><button class="start">Shiko lëvizjen</button></div></article>`).join('')}async function openEx(name){const x=data.find(v=>v.name===name);const gif=await findGif(x);demoGif.src=gif||fallback;title.textContent=x.name;badges.innerHTML=`<span class="badge">${x.group}</span><span class="badge">Animated demo</span>`;sets.textContent=x.sets;reps.textContent=x.reps;rest.textContent=x.rest;worked.textContent=x.muscles;steps.innerHTML=x.steps.map(s=>`<li>${s}</li>`).join('');sheet.style.display='flex';document.body.style.overflow='hidden';complete.textContent='✓ Përfundo setin'}close.onclick=()=>{sheet.style.display='none';document.body.style.overflow=''};sheet.onclick=e=>{if(e.target===sheet)close.onclick()};complete.onclick=()=>complete.textContent='✓ Seti u regjistrua';renderFilters();render();loadAll();</script></body></html>
