<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FITPRO</title><style>*{box-sizing:border-box}body{margin:0;background:#05090b;color:#f5f7f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#081116,#030708);padding-bottom:90px}.top{padding:18px;display:flex;justify-content:space-between}.logo{font-size:25px;font-weight:950}.logo b{color:#adf22d}.hero{margin:0 16px 16px;padding:22px;border-radius:25px;background:radial-gradient(circle at 85% 15%,#2b3f11,#0b1418 53%);border:1px solid #1d2b31}.eyebrow{color:#adf22d;font-weight:900;font-size:11px}.hero h1{font-size:38px;line-height:1;margin:8px 0}.hero p,.meta{color:#919da2}.section{padding:7px 16px}.head{display:flex;justify-content:space-between;align-items:end;margin:12px 0}.head h2{margin:0}.head span{color:#7f8b90;font-size:12px}.muscles{display:flex;gap:8px;overflow:auto;padding-bottom:7px}.chip{border:1px solid #27343a;background:#0d1519;color:#cbd1d3;border-radius:99px;padding:9px 14px;white-space:nowrap}.chip.active{background:#adf22d;color:#071005}.search{width:100%;margin:7px 0 12px;background:#0c1418;border:1px solid #233038;border-radius:14px;padding:13px 15px;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0c1317;border:1px solid #1c282e;border-radius:18px;overflow:hidden;cursor:pointer}.visual{height:180px;background:#fff;position:relative}.visual img{width:100%;height:100%;object-fit:contain}.tag{position:absolute;left:8px;top:8px;background:#adf22d;color:#071005;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:900}.live{position:absolute;right:7px;bottom:7px;background:#071005e8;color:#adf22d;border-radius:99px;padding:5px 8px;font-size:9px}.cardbody{padding:12px}.card h3{font-size:14px;margin:0 0 5px}.meta{font-size:10px}.start{margin-top:9px;width:100%;border:0;border-radius:10px;padding:9px;background:#172126;color:#adf22d;font-weight:800}.loading{grid-column:1/-1;padding:40px;text-align:center;color:#94a0a5}.sheet{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:flex-end;justify-content:center}.panel{width:min(680px,100%);max-height:95vh;overflow:auto;background:#091115;border-radius:27px 27px 0 0;padding:20px}.close{float:right;width:38px;height:38px;border:0;border-radius:50%;background:#182226;color:#fff;font-size:20px}.gifhero{height:350px;background:#fff;border-radius:20px;overflow:hidden;clear:both;margin-top:10px}.gifhero img{width:100%;height:100%;object-fit:contain}.panel h2{font-size:28px}.badges{display:flex;gap:7px}.badge{background:#172126;padding:7px 10px;border-radius:99px;color:#bac2c5;font-size:11px}.steps li{margin:12px 0;line-height:1.45}.credit{text-align:center;color:#68757a;font-size:10px;margin:24px}@media(max-width:390px){.visual{height:150px}.gifhero{height:290px}}</style></head><body><main class="app"><header class="top"><div class="logo"><b>✣</b> FITPRO</div><div>DEMO</div></header><section class="hero"><div class="eyebrow">UPPER BODY · ANIMATED</div><h1>30 ushtrime.<br>GIF real.</h1><p>GIF-et vijnë direkt nga folderi videos i dataset-it.</p></section><section class="section"><div class="head"><h2>Biblioteka</h2><span id="resultCount">Duke ngarkuar…</span></div><input id="search" class="search" placeholder="Kërko ushtrim..."><div class="muscles" id="filters"></div></section><section class="section"><div class="grid" id="grid"><div class="loading">Duke ngarkuar 30 GIF-et…</div></div></section><div class="credit">Media © Gym Visual · non-commercial demo</div></main><div class="sheet" id="sheet"><div class="panel"><button class="close" id="close">×</button><div class="gifhero"><img id="demoGif"></div><h2 id="title"></h2><div class="badges" id="badges"></div><p id="worked"></p><ol class="steps" id="steps"></ol></div></div><script>const DATA='https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json';const RAW='https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/';let data=[],filter='Të gjitha',term='';const groups=['Të gjitha','Gjoks','Shpinë','Shpatulla','Krahë'];function groupOf(x){const b=(x.body_part||x.category||'').toLowerCase();return b==='chest'?'Gjoks':b==='back'?'Shpinë':b==='shoulders'?'Shpatulla':b==='upper arms'?'Krahë':null}function renderFilters(){filters.innerHTML=groups.map(g=>`<button class="chip ${g===filter?'active':''}" data-g="${g}">${g}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.g;renderFilters();render()})}function visible(){return data.filter(x=>(filter==='Të gjitha'||x.group===filter)&&x.name.toLowerCase().includes(term))}function render(){const list=visible();resultCount.textContent=list.length+' ushtrime';grid.innerHTML=list.map(x=>`<article class="card" data-id="${x.id}"><div class="visual"><img src="${RAW+x.gif_url}" alt="${x.name}" loading="lazy"><span class="tag">${x.group}</span><span class="live">● GIF</span></div><div class="cardbody"><h3>${x.name}</h3><div class="meta">${x.target} · ${x.equipment}</div><button class="start">Shiko lëvizjen</button></div></article>`).join('');grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>openEx(data.find(x=>x.id===c.dataset.id)))}function openEx(x){demoGif.src=RAW+x.gif_url;title.textContent=x.name;badges.innerHTML=`<span class="badge">${x.group}</span><span class="badge">${x.equipment}</span>`;worked.textContent='Target: '+x.target+(x.muscle_group?' · '+x.muscle_group:'');const s=x.instruction_steps?.en||[];steps.innerHTML=s.map(v=>`<li>${v}</li>`).join('');sheet.style.display='flex';document.body.style.overflow='hidden'}close.onclick=()=>{sheet.style.display='none';document.body.style.overflow=''};sheet.onclick=e=>{if(e.target===sheet)close.onclick()};search.oninput=e=>{term=e.target.value.toLowerCase().trim();render()};async function init(){renderFilters();try{const r=await fetch(DATA);if(!r.ok)throw Error(r.status);const all=await r.json();const upper=all.map(x=>({...x,group:groupOf(x)})).filter(x=>x.group&&x.gif_url);const quotas={Gjoks:7,Shpinë:8,Shpatulla:7,Krahë:8};for(const g of Object.keys(quotas))data.push(...upper.filter(x=>x.group===g).slice(0,quotas[g]));render()}catch(e){console.error(e);grid.innerHTML='<div class="loading">Gabim gjatë leximit të dataset-it.</div>';resultCount.textContent='Gabim'}}init();</script></body></html>
