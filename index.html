<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05090b"><title>FITPRO</title><style>*{box-sizing:border-box}body{margin:0;background:#05090b;color:#f5f7f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px;background:linear-gradient(180deg,#081116,#030708)}header{padding:18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950}.logo b,.accent{color:#adf22d}.pill{padding:8px 12px;border:1px solid #2b3940;border-radius:999px;font-size:11px}.hero{margin:0 16px 14px;padding:22px;border:1px solid #1d2b31;border-radius:26px;background:radial-gradient(circle at 90% 10%,#2b3f11,#0b1418 55%)}.hero small{color:#adf22d;font-weight:900}.hero h1{font-size:35px;line-height:1;margin:8px 0}.hero p,.muted{color:#919da2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#ffffff08;border-radius:14px;padding:10px}.stat b{display:block}.toolbar,.section{padding:8px 16px}.search{width:100%;padding:14px;background:#0c1418;color:#fff;border:1px solid #233038;border-radius:15px;outline:0}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0}.chip{white-space:nowrap;padding:9px 13px;border-radius:999px;border:1px solid #27343a;background:#0d1519;color:#cbd1d3}.chip.active{background:#adf22d;color:#071005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.card{overflow:hidden;border:1px solid #1c282e;border-radius:18px;background:#0c1317}.visual{height:180px;background:#fff;position:relative}.visual img{width:100%;height:100%;object-fit:contain}.tag{position:absolute;left:7px;top:7px;background:#adf22d;color:#071005;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900}.body{padding:11px}.body h3{font-size:13px;margin:0 0 5px}.body small{color:#8f9a9f}.btn{width:100%;margin-top:8px;padding:9px;border:0;border-radius:10px;background:#172126;color:#adf22d;font-weight:850}.more{display:block;margin:20px auto;padding:12px 20px;border:1px solid #314047;border-radius:14px;background:#10191d;color:#fff}.status{padding:24px;text-align:center;color:#8f9a9f}.sheet{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:flex-end}.panel{width:min(760px,100%);max-height:94vh;overflow:auto;margin:auto;background:#091115;border-radius:25px 25px 0 0;padding:18px}.close{float:right;width:40px;height:40px;border:0;border-radius:50%;background:#182226;color:#fff;font-size:20px}.heroGif{height:330px;clear:both;background:#fff;border-radius:20px;overflow:hidden}.heroGif img{width:100%;height:100%;object-fit:contain}.panel h2{font-size:27px}.box{padding:14px;background:#10191d;border-radius:15px;margin:12px 0}.steps li{margin:10px 0;line-height:1.45}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:70px;background:#081014ee;border-top:1px solid #1d292f;display:flex;justify-content:space-around;align-items:center}.bottom button{border:0;background:none;color:#8a969b}.bottom .active{color:#adf22d}.fatal{margin:20px 16px;padding:16px;border:1px solid #3b2d2d;background:#171010;border-radius:16px;color:#d7c5c5}@media(max-width:420px){.grid{grid-template-columns:1fr}.visual{height:220px}.heroGif{height:290px}}</style></head><body><main class="app"><header><div class="logo"><b>✣</b> FITPRO</div><div class="pill" id="total">Biblioteka</div></header><section class="hero"><small>FITPRO · SHQIP</small><h1>Biblioteka e ushtrimeve.</h1><p>Të gjitha ushtrimet mbeten në bibliotekë, ndërsa GIF-et ngarkohen vetëm kur shfaqen në ekran.</p><div class="stats"><div class="stat"><b id="allCount">—</b><span class="muted">Ushtrime</span></div><div class="stat"><b id="shownCount">—</b><span class="muted">Rezultate</span></div><div class="stat"><b id="pageCount">24</b><span class="muted">Për faqe</span></div></div></section><section class="toolbar"><input class="search" id="search" placeholder="Kërko ushtrim, muskul ose pajisje..."></section><section class="section"><div class="chips" id="chips"></div></section><div id="error"></div><section><div class="grid" id="grid"><div class="status">Po ngarkohet lista e ushtrimeve…</div></div><button class="more" id="more" style="display:none">Shfaq 24 të tjera</button></section></main><nav class="bottom"><button class="active">⌂<br>Home</button><button>▣<br>Ushtrime</button><button>★<br>Ruajtura</button></nav><div class="sheet" id="sheet"><div class="panel"><button class="close" id="close">×</button><div class="heroGif"><img id="bigGif" alt="GIF ushtrimi"></div><h2 id="title"></h2><div class="box" id="info"></div><h3>Hapat</h3><ol class="steps" id="steps"></ol></div></div><script>const CDN='https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@main/';const SOURCES=[CDN+'data/exercises.json','https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json'];const MAP={chest:'Gjoks',back:'Shpinë',shoulders:'Shpatulla','upper arms':'Krahë',waist:'Bark/Core','upper legs':'Këmbë sipër','lower legs':'Këmbë poshtë',cardio:'Cardio','lower arms':'Parakrah',neck:'Qafë'};let all=[],filtered=[],group='Të gjitha',limit=24;const grid=document.getElementById('grid'),chips=document.getElementById('chips'),search=document.getElementById('search'),more=document.getElementById('more');function timeoutFetch(url,ms=6000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal,cache:'force-cache'}).finally(()=>clearTimeout(t))}async function getData(){for(const url of SOURCES){try{const r=await timeoutFetch(url);if(!r.ok)continue;const j=await r.json();if(Array.isArray(j)&&j.length)return j}catch(e){console.warn('source failed',url,e)}}throw new Error('Dataset unavailable')}function grp(x){return MAP[String(x.body_part||x.category||'').toLowerCase()]||'Tjetër'}function gif(x){return CDN+String(x.gif_url||'').replace(/^\//,'')}function renderChips(){const gs=['Të gjitha',...new Set(all.map(x=>x.group))];chips.innerHTML=gs.map(g=>`<button class="chip ${g===group?'active':''}" data-g="${g}">${g}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{group=b.dataset.g;limit=24;renderChips();apply()})}function apply(){const q=search.value.trim().toLowerCase();filtered=all.filter(x=>(group==='Të gjitha'||x.group===group)&&(!q||[x.name,x.target,x.equipment,x.muscle_group,x.group].join(' ').toLowerCase().includes(q)));document.getElementById('shownCount').textContent=filtered.length;render()}function render(){const list=filtered.slice(0,limit);grid.innerHTML=list.length?list.map(x=>`<article class="card" data-id="${x.id}"><div class="visual"><img loading="lazy" src="${gif(x)}" alt="${x.name}"><span class="tag">${x.group}</span></div><div class="body"><h3>${x.name}</h3><small>${x.target||''} · ${x.equipment||''}</small><button class="btn">Shiko ushtrimin</button></div></article>`).join(''):'<div class="status">Nuk u gjet asnjë ushtrim.</div>';more.style.display=limit<filtered.length?'block':'none';grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>openEx(all.find(x=>String(x.id)===c.dataset.id))}function stepsFor(x){const s=x.instruction_steps?.en;if(Array.isArray(s)&&s.length)return s;const r=x.instructions?.en;if(typeof r==='string')return r.split('. ').filter(Boolean);return ['Shiko demonstrimin e animuar dhe kryeje lëvizjen me kontroll.']}function openEx(x){if(!x)return;bigGif.src=gif(x);title.textContent=x.name;info.innerHTML=`<b class="accent">${x.group}</b><br>${x.target||''} · ${x.equipment||''}`;steps.innerHTML=stepsFor(x).map(s=>`<li>${s}</li>`).join('');sheet.style.display='flex';document.body.style.overflow='hidden'}close.onclick=()=>{sheet.style.display='none';document.body.style.overflow=''};sheet.onclick=e=>{if(e.target===sheet)close.onclick()};search.oninput=()=>{limit=24;apply()};more.onclick=()=>{limit+=24;render()};(async()=>{try{const raw=await getData();all=raw.filter(x=>x.gif_url).map(x=>({...x,group:grp(x)}));document.getElementById('allCount').textContent=all.length;document.getElementById('total').textContent=all.length+' ushtrime';renderChips();apply()}catch(e){console.error(e);grid.innerHTML='';document.getElementById('error').innerHTML='<div class="fatal"><b>Dataset-i nuk u ngarkua.</b><br>Faqja nuk do të mbetet më e bllokuar në loading. Rifreskoje ose provo përsëri pas pak.</div>';document.getElementById('allCount').textContent='0';document.getElementById('shownCount').textContent='0'}})();</script></body></html>
