<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FITPRO — Upper Body</title><style>*{box-sizing:border-box}body{margin:0;background:#050a0d;color:#f7f8f8;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#071015,#030709);padding-bottom:88px}.top{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950;font-style:italic}.logo b{color:#a9ef27}.pro{border:1px solid #344149;border-radius:12px;padding:8px 12px;font-weight:800}.hero{margin:4px 16px 16px;padding:22px;border-radius:24px;background:radial-gradient(circle at 80% 20%,#27380f,#0b1418 52%);border:1px solid #1c292f}.eyebrow{color:#a9ef27;font-weight:800;font-size:12px;letter-spacing:1px}.hero h1{font-size:36px;line-height:.98;margin:8px 0}.hero p{color:#96a0a5;margin:8px 0 20px}.progress{display:flex;align-items:center;gap:14px}.ring{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#a9ef27 68%,#172126 0);position:relative;font-weight:900}.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#0b1418}.ring span{position:relative}.progress small{color:#909b9f}.section{padding:8px 16px}.head{display:flex;justify-content:space-between;align-items:end;margin:10px 0 13px}.head h2{margin:0;font-size:21px}.head span{color:#7f8b90;font-size:12px}.muscles{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.chip{border:1px solid #27343a;background:#0d1519;color:#cbd1d3;border-radius:99px;padding:9px 14px;white-space:nowrap;font-weight:750}.chip.active{background:#a9ef27;color:#081005;border-color:#a9ef27}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0c1317;border:1px solid #1c282e;border-radius:18px;overflow:hidden;cursor:pointer}.visual{height:132px;display:grid;place-items:center;background:radial-gradient(circle,#18272c,#080e11);position:relative}.figure{font-size:58px;filter:grayscale(1)}.tag{position:absolute;left:9px;top:9px;background:#a9ef27;color:#071005;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:900}.cardbody{padding:12px}.card h3{font-size:15px;margin:0 0 5px}.meta{font-size:11px;color:#8d989d}.start{margin-top:10px;width:100%;border:0;border-radius:10px;padding:9px;background:#172126;color:#a9ef27;font-weight:850}.workout{margin:8px 16px;padding:17px;background:#0c1317;border:1px solid #1d2a30;border-radius:20px}.workouttop{display:flex;justify-content:space-between}.workout h3{margin:0}.workout p{color:#8d989d;font-size:13px}.bar{height:7px;background:#192328;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#a9ef27}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:72px;background:#081014ee;backdrop-filter:blur(15px);border-top:1px solid #1d292f;display:flex;justify-content:space-around;align-items:center;z-index:20}.nav{background:none;border:0;color:#78858a;font-size:11px}.nav b{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:#a9ef27}.sheet{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:flex-end;justify-content:center}.panel{width:min(620px,100%);max-height:91vh;overflow:auto;background:#091115;border-radius:26px 26px 0 0;padding:20px}.close{float:right;width:38px;height:38px;border:0;border-radius:50%;background:#182226;color:#fff;font-size:20px}.exerciseHero{height:220px;border-radius:20px;background:radial-gradient(circle,#24343a,#080e11);display:grid;place-items:center;font-size:110px}.panel h2{font-size:28px;margin:17px 0 5px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{background:#172126;padding:7px 10px;border-radius:99px;color:#b8c0c3;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#10191d;border-radius:13px;padding:12px 5px;text-align:center}.stat small{display:block;color:#7f8a8f;margin-bottom:4px}.stat b{font-size:13px}.steps{padding:0;list-style:none;counter-reset:x}.steps li{counter-increment:x;display:flex;gap:12px;margin:15px 0;line-height:1.45;color:#d9dddf}.steps li:before{content:counter(x);flex:0 0 28px;height:28px;border:1px solid #a9ef27;color:#a9ef27;border-radius:50%;display:grid;place-items:center;font-weight:900}.musclebox{padding:15px;background:#10191d;border-radius:16px;margin:15px 0}.musclebox b{color:#a9ef27}.primary{width:100%;border:0;border-radius:14px;background:#a9ef27;color:#081005;padding:15px;font-size:15px;font-weight:950;margin-top:10px}@media(max-width:370px){.hero h1{font-size:31px}.visual{height:115px}}</style></head><body><main class="app"><header class="top"><div class="logo"><b>✣</b> FITPRO</div><div class="pro">♛ PRO</div></header><section class="hero"><div class="eyebrow">UPPER BODY PROGRAM</div><h1>Ndërto<br>forcën lart.</h1><p>Gjoks · Shpinë · Shpatulla · Krahë</p><div class="progress"><div class="ring"><span>68%</span></div><div><b>Progresi javor</b><br><small>4 nga 6 stërvitje</small></div></div></section><section class="section"><div class="head"><h2>Grupet muskulore</h2><span>Upper Body</span></div><div class="muscles" id="filters"></div></section><section class="section"><div class="head"><h2>Ushtrimet</h2><span id="resultCount"></span></div><div class="grid" id="grid"></div></section><section class="workout"><div class="workouttop"><div><h3>Upper Body A</h3><p>6 ushtrime · ~52 min</p></div><b style="color:#a9ef27">35%</b></div><div class="bar"><i></i></div></section></main><nav class="bottom"><button class="nav active"><b>⌂</b>Home</button><button class="nav"><b>▣</b>Workouts</button><button class="nav"><b>◉</b>Exercises</button><button class="nav"><b>▥</b>Progress</button></nav><div class="sheet" id="sheet"><div class="panel"><button class="close" id="close">×</button><div class="exerciseHero" id="heroIcon">🏋️</div><h2 id="title"></h2><div class="badges" id="badges"></div><div class="stats"><div class="stat"><small>Sete</small><b id="sets"></b></div><div class="stat"><small>Përsëritje</small><b id="reps"></b></div><div class="stat"><small>Pushim</small><b id="rest"></b></div></div><div class="musclebox"><small>Muskujt kryesorë</small><br><b id="worked"></b></div><h3>Si bëhet saktë</h3><ol class="steps" id="steps"></ol><button class="primary" id="complete">✓ Përfundo setin</button></div></div><script>const data=[{name:'Bench Press',group:'Gjoks',icon:'🏋️',muscles:'Pectoralis major · Triceps · Anterior deltoid',sets:'3–4',reps:'6–12',rest:'60–90s',level:'Mesatar',steps:['Shtrihu në bankë me shputat të vendosura fort në dysheme dhe sytë afërsisht poshtë shufrës.','Tërhiq shpatullat prapa dhe poshtë; mbaje kraharorin lart dhe kap shufrën pak më gjerë se shpatullat.','Nxirre shufrën nga mbajtësja me kyçet neutrale dhe ule me kontroll drejt pjesës së mesme të kraharorit.','Mbaji bërrylat në një kënd të kontrolluar ndaj trungut dhe mos i hap ekstremisht anash.','Shtyje shufrën lart deri në pozicionin fillestar pa humbur stabilitetin e shpatullave.']},{name:'Incline Dumbbell Press',group:'Gjoks',icon:'💪',muscles:'Upper chest · Triceps · Anterior deltoid',sets:'3',reps:'8–12',rest:'60–90s',level:'Mesatar',steps:['Vendose bankën në pjerrësi të moderuar rreth 30–45°.','Mbaji hantelat anash kraharorit me shpatullat të stabilizuara prapa.','Shtyji hantelat lart në mënyrë të kontrolluar pa i përplasur mes tyre.','Uli ngadalë deri sa bërrylat të jenë pak poshtë vijës së shpatullave, nëse mobiliteti ta lejon.']},{name:'Pull-Up',group:'Shpinë',icon:'🧗',muscles:'Latissimus dorsi · Biceps · Upper back',sets:'3–4',reps:'5–10',rest:'90s',level:'Mesatar',steps:['Kap shufrën me kapje pak më të gjerë se shpatullat dhe varu me trung të kontrolluar.','Aktivizo shpatullat duke i tërhequr poshtë para se të përkulësh bërrylat.','Tërhiq kraharorin drejt shufrës duke menduar se po i çon bërrylat poshtë.','Ulu me kontroll deri në zgjatje të plotë pa humbur tensionin e shpatullave.']},{name:'Seated Cable Row',group:'Shpinë',icon:'🚣',muscles:'Mid back · Lats · Biceps',sets:'3',reps:'8–12',rest:'60–90s',level:'Lehtë',steps:['Ulu me shtyllën kurrizore neutrale dhe gjunjët lehtë të përkulur.','Nis lëvizjen duke tërhequr shpatullat prapa, pastaj sill bërrylat pranë trungut.','Tërhiq dorezën drejt pjesës së poshtme të brinjëve pa u lëkundur prapa.','Ktheje peshën ngadalë derisa krahët të zgjaten dhe përsërit.']},{name:'Overhead Press',group:'Shpatulla',icon:'🏋️',muscles:'Deltoids · Triceps · Upper chest',sets:'3–4',reps:'6–10',rest:'90s',level:'Mesatar',steps:['Qëndro stabil me këmbët afërsisht në gjerësinë e shpatullave dhe trungun të tendosur.','Mbaje peshën në nivelin e sipërm të kraharorit me parakrahët afër vertikalë.','Shtyje peshën mbi kokë pa e ekzagjeruar harkun e mesit.','Përfundo me peshën të balancuar mbi trung dhe ule me kontroll.']},{name:'Lateral Raise',group:'Shpatulla',icon:'🪽',muscles:'Lateral deltoid',sets:'3',reps:'12–15',rest:'45–60s',level:'Lehtë',steps:['Mbaji hantelat anash me bërrylat lehtë të përkulur.','Ngriji krahët anash me kontroll duke udhëhequr lëvizjen me bërryla.','Ndalo afërsisht në nivelin e shpatullave; mos i ngrit shpatullat drejt veshëve.','Uli ngadalë dhe ruaj tensionin në deltoid gjatë gjithë përsëritjes.']},{name:'Biceps Curl',group:'Krahë',icon:'💪',muscles:'Biceps brachii · Brachialis',sets:'3',reps:'10–15',rest:'45–60s',level:'Lehtë',steps:['Qëndro drejt me bërrylat pranë trungut.','Përkuli bërrylat pa i shtyrë përpara dhe ngriji peshat me kontroll.','Shtrëngo bicepsin në pjesën e sipërme pa lëvizur shpatullën.','Uli peshat ngadalë deri në zgjatje të kontrolluar.']},{name:'Triceps Pushdown',group:'Krahë',icon:'🔻',muscles:'Triceps brachii',sets:'3',reps:'10–15',rest:'45–60s',level:'Lehtë',steps:['Qëndro përballë kabllos me bërrylat të ngjitur pranë trungut.','Shtyje dorezën poshtë vetëm duke zgjatur bërrylat.','Në fund shtrëngo tricepsin pa i çuar shpatullat përpara.','Kthehu ngadalë deri sa parakrahët të ngrihen, duke mbajtur bërrylat në vend.']}];let filter='Të gjitha';const filters=['Të gjitha','Gjoks','Shpinë','Shpatulla','Krahë'];const grid=document.getElementById('grid'),sheet=document.getElementById('sheet');function renderFilters(){document.getElementById('filters').innerHTML=filters.map(x=>`<button class="chip ${x===filter?'active':''}" onclick="filter='${x}';renderFilters();render()">${x}</button>`).join('')}function render(){const list=data.filter(x=>filter==='Të gjitha'||x.group===filter);resultCount.textContent=list.length+' ushtrime';grid.innerHTML=list.map(x=>`<article class="card" onclick="openEx('${x.name.replaceAll("'","\\'")}')"><div class="visual"><span class="tag">${x.group}</span><span class="figure">${x.icon}</span></div><div class="cardbody"><h3>${x.name}</h3><div class="meta">${x.muscles}</div><button class="start">Shiko teknikën</button></div></article>`).join('')}function openEx(name){const x=data.find(v=>v.name===name);heroIcon.textContent=x.icon;title.textContent=x.name;badges.innerHTML=`<span class="badge">${x.group}</span><span class="badge">${x.level}</span>`;sets.textContent=x.sets;reps.textContent=x.reps;rest.textContent=x.rest;worked.textContent=x.muscles;steps.innerHTML=x.steps.map(s=>`<li>${s}</li>`).join('');sheet.style.display='flex';document.body.style.overflow='hidden';complete.textContent='✓ Përfundo setin';complete.style.background='#a9ef27'}close.onclick=()=>{sheet.style.display='none';document.body.style.overflow=''};sheet.onclick=e=>{if(e.target===sheet)close.onclick()};complete.onclick=()=>{complete.textContent='✓ Seti u regjistrua';complete.style.background='#d8ff91'};renderFilters();render();</script></body></html>
