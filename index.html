const COMMIT='7455efae41b330c265e7cd4b78dfa848e7ce5ebd',RAW=`https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/${COMMIT}/`,DATA='./exercises.json';const GROUPS=['Të gjitha','Gjoks','Shpinë','Shpatulla','Krahë','Bark/Core','Këmbë sipër','Këmbë poshtë','Kardio','Parakrah','Qafë','Tjetër'],MAP={chest:'Gjoks',back:'Shpinë',shoulders:'Shpatulla','upper arms':'Krahë',waist:'Bark/Core','upper legs':'Këmbë sipër','lower legs':'Këmbë poshtë',cardio:'Kardio','lower arms':'Parakrah',neck:'Qafë'};const TERM={'body weight':'Pesha trupore','barbell':'Shufër','dumbbell':'Shtangë dore','cable':'Kabllo','band':'Shirit elastik','resistance band':'Shirit rezistence','kettlebell':'Kettlebell','smith machine':'Makina Smith','leverage machine':'Makinë me levë','assisted':'Me asistencë','upper arms':'Krahët e sipërm','lower arms':'Parakrahët','upper legs':'Kofshët','lower legs':'Pjesa e poshtme e këmbëve','shoulders':'Shpatullat','chest':'Gjoksi','back':'Shpina','waist':'Barku/Core','cardio':'Kardio','neck':'Qafa','pectorals':'Gjoksi','delts':'Deltoidet','biceps':'Bicepsi','triceps':'Tricepsi','abs':'Muskujt e barkut','glutes':'Glutealët','quads':'Kuadricepsi','hamstrings':'Hamstringët','calves':'Pulpat','lats':'Latissimus','traps':'Trapezi','spine':'Shtylla kurrizore'};const PHRASES=[['push-up','pompa'],['pull-up','tërheqje në shufër'],['chin-up','tërheqje me kapje të kundërt'],['sit-up','ngritje e trungut'],['crunch','mbledhje barku'],['squat','ulje-ngritje'],['lunge','hap përpara'],['deadlift','ngritje nga toka'],['bench press','shtytje në stol'],['shoulder press','shtytje mbi kokë'],['chest press','shtytje për gjoks'],['biceps curl','përkulje për biceps'],['triceps extension','zgjatje për triceps'],['lateral raise','ngritje anësore'],['front raise','ngritje përpara'],['leg raise','ngritje e këmbëve'],['leg press','shtytje me këmbë'],['leg extension','zgjatje e këmbëve'],['leg curl','përkulje e këmbëve'],['calf raise','ngritje në gishta'],['plank','dërrasë'],['row','tërhe function build(raw){return raw.filter(x=>x&&x.name&&x.gif_url).map(x=>({id:String(x.id),name:trName(x.name),original:x.name,group:groupOf(x),target:trTerm(x.target),muscle:trTerm(x.muscle_group),equip:trTerm(x.equipment),gif:asset(x.gif_url),image:asset(x.image),steps:x.instruction_steps?.sq||x.instruction_steps?.en||[],description:x.instructions?.sq||x.instructions?.en||''}))}function filtered(){const q=state.q;return state.list.filter(x=>(!state.savedOnly||saved.has(x.id))&&(state.group==='Të gjitha'||x.group===state.group)&&(!q||[x.name,x.original,x.group,x.target,x.muscle,x.equip].join(' ').toLowerCase().includes(q)))}function renderChips(){$('chips').innerHTML=GROUPS.map(g=>`<button class="chip ${g===state.group?'active':''}" data-g="${g}">${g}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.group=b.dataset.g;state.page=24;renderChips();render()})}function card(x){return `<article class="card" data-id="${x.id}"><div class="visual"><img loading="lazy" src="${x.gif}" alt="${x.name}" onerror="if(this.dataset.fallback!=='1'&&'${x.image}'){this.dataset.fallback='1';this.src='${x.image}'}else{this.style.display='none';this.nextElementSibling.style.display='grid'}"><div class="fallback" style="display:none">Media nuk u ngarkua</div><span class="tag">${x.group}</span><span class="kind">${saved.has(x.id)?'★':'GIF'}</span></div><div class="body"><h3>${x.name}</h3><small>${x.target} · ${x.equip}</small><button class="view">Hape</button></div></article>`}function render(){const list=filtered(),n=Math.min(state.page,list.length);$('shownCount').textContent=n;$('allCount').textContent=state.list.length.toLocaleString('en-US');$('favCount').textContent=saved.size;$('resultLabel').textContent=`${list.length.toLocaleString('en-US')} REZULTATE`;$('sectionName').textContent=state.savedOnly?'Të ruajtura':'Biblioteka';$('grid').innerHTML=list.length?list.slice(0,n).map(card).join(''):'<div class="empty">Nuk u gjet asnjë ushtrim.</div>';$('more').style.display=n<list.length?'block':'none';$('grid').querySelectorAll('.card').forEach(c=>c.onclick=()=>openItem(state.list.find(x=>x.id===c.dataset.id)))}function openItem(x){if(!x)return;state.current=x;const img=$('bigMedia'),fb=$('mediaFallback');fb.style.display='grid';fb.textContent='Po ngarkohet…';img.style.display='block';img.onload=()=>fb.style.display='none';img.onerror=()=>{img.style.display='none';fb.textContent='Media nuk u ngarkua'};img.src=x.gif;$('title').textContent=x.name;$('info').innerHTML=`<b class="goldText">${x.group}</b><br>Objektivi: ${x.target}<br>Pajisja: ${x.equip}${x.muscle?`<br>Muskuli: ${x.muscle}`:''}`;const s=x.steps.length?x.steps:(x.description?[x.description]:[]);$('steps').innerHTML=s.map(v=>`<li>${v}</li>`).join('');updateFavButton();$('sheet').style.display='flex';document.body.classList.add('lock')}function updateFavButton(){if(!state.current)return;$('favorite').textContent=saved.has(state.current.id)?'★ Hiqe nga të ruajturat':'☆ Ruaje ushtrimin'}function toggleFav(){if(!state.current)return;saved.has(state.current.id)?saved.delete(state.current.id):saved.add(state.current.id);localStorage.setItem('kp-saved',JSON.stringify([...saved]));updateFavButton();render()}
async function load(){try{const r=await fetch(DATA);if(!r.ok)throw Error(`HTTP ${r.status}`);const raw=await r.json();if(!Array.isArray(raw)||!raw.length)throw Error('JSON bosh');state.list=build(raw);renderChips();render();$('offlineLabel').textContent=`${saved.size} ushtrime të ruajtura`}catch(e){$('resultLabel').textContent='GABIM';$('grid').innerHTML=`<div class="empty">Gabim në exercises.json: ${e.message}</div>`}}async function downloadAll(){if(!navigator.serviceWorker?.controller){$('progressText').textContent='Hape aplikacionin përsëri dhe provo.';return}const urls=[...new Set(state.list.map(x=>x.gif).filter(Boolean))];if(!urls.length)return;$('download').disabled=true;$('progress').style.display='block';const ch=new MessageChannel();ch.port1.onmessage=e=>{const d=e.data;if(d.type==='progress'||d.type==='complete'){const pct=d.total?Math.round((d.done+d.failed)/d.total*100):0;$('bar').style.width=pct+'%';$('progressText').textContent=`${d.done} ruajtur · ${d.failed} dështuan · ${pct}%`}if(d.type==='complete'){$('download').disabled=false;$('offlineLabel').textContent=`Offline: ${d.done} GIF`}};navigator.serviceWorker.controller.postMessage({type:'CACHE_GIFS',urls},[ch.port2])}function showSaved(){state.savedOnly=true;state.page=24;state.group='Të gjitha';renderChips();render();document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));$('savedNav').classList.add('active');window.scrollTo({top:480,behavior:'smooth'})}function showAll(){state.savedOnly=false;state.page=24;render();document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));$('libraryNav').classList.add('active');window.scrollTo({top:480,behavior:'smooth'})}function net(){$('net').textContent=navigator.onLine?'ONLINE':'OFFLINE';$('net').style.color=navigator.onLine?'#d8bd6c':'#e69b5b'}window.addEventListener('online',net);window.addEventListener('offline',net);$('download').onclick=downloadAll;$('favoritesBtn').onclick=showSaved;$('savedNav').onclick=showSaved;$('libraryNav').onclick=showAll;$('homeNav').onclick=()=>{state.savedOnly=false;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));$('homeNav').classList.add('active');render();window.scrollTo({top:0,behavior:'smooth'})};$('favorite').onclick=toggleFav;$('close').onclick=()=>{$('sheet').style.display='none';document.body.classList.remove('lock')};$('sheet').onclick=e=>{if(e.target===$('sheet'))$('close').onclick()};$('search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();state.page=24;render()};$('more').onclick=()=>{state.page+=24;render()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(console.error);net();renderChips();load();</script></body></html>
