<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05090b"><title>FITPRO</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#05090b;color:#f5f7f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.no-scroll{overflow:hidden}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#081116,#030708);padding-bottom:92px}header{padding:18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950}.logo b,.accent{color:#adf22d}.pill{padding:8px 12px;border:1px solid #2b3940;border-radius:999px;font-size:11px}.hero{margin:0 16px 14px;padding:22px;border:1px solid #1d2b31;border-radius:26px;background:radial-gradient(circle at 90% 10%,#2b3f11,#0b1418 55%)}.hero small{color:#adf22d;font-weight:900}.hero h1{font-size:35px;line-height:1;margin:8px 0}.hero p,.muted{color:#919da2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#ffffff08;border-radius:14px;padding:10px}.stat b{display:block;font-size:18px}.toolbar,.section{padding:8px 16px}.search{width:100%;padding:14px;background:#0c1418;color:#fff;border:1px solid #233038;border-radius:15px}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0}.chip{white-space:nowrap;padding:9px 13px;border-radius:999px;border:1px solid #27343a;background:#0d1519;color:#cbd1d3}.chip.active{background:#adf22d;color:#071005;border-color:#adf22d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.card{overflow:hidden;border:1px solid #1c282e;border-radius:18px;background:#0c1317}.visual{height:182px;background:#fff;position:relative}.visual img{width:100%;height:100%;object-fit:contain;display:block}.fallback{position:absolute;inset:0;display:grid;place-items:center;color:#6d757d;background:#f2f2f2;font-size:12px}.tag,.kind{position:absolute;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900}.tag{left:8px;top:8px;background:#adf22d;color:#071005}.kind{right:8px;bottom:8px;background:#071005e8;color:#adf22d}.cardbody{padding:12px}.card h3{font-size:14px;margin:0 0 5px}.card small{color:#8f9a9f}.btn{width:100%;margin-top:9px;padding:10px;border:0;border-radius:10px;background:#172126;color:#adf22d;font-weight:850}.more{display:block;margin:18px auto;padding:12px 20px;border:1px solid #314047;border-radius:14px;background:#10191d;color:#fff}.sheet{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:flex-end}.panel{width:min(760px,100%);max-height:94vh;overflow:auto;margin:auto;background:#091115;border-radius:25px 25px 0 0;padding:18px}.close{float:right;width:40px;height:40px;border:0;border-radius:50%;background:#182226;color:#fff;font-size:20px}.heroGif{height:330px;clear:both;background:#fff;border-radius:20px;overflow:hidden;position:relative}.heroGif img{width:100%;height:100%;object-fit:contain}.panel h2{font-size:27px;margin:12px 0 6px}.box{padding:14px;background:#10191d;border-radius:15px;margin:12px 0}.steps{padding-left:18px}.steps li{margin:10px 0;line-height:1.45}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:70px;background:#081014ee;border-top:1px solid #1d292f;display:flex;justify-content:space-around;align-items:center}.bottom button{border:0;background:none;color:#8a969b}.bottom .active{color:#adf22d}.note{margin:0 16px 18px;padding:14px;border:1px solid #223039;border-radius:16px;background:#0c1418;color:#bfc8cb;font-size:12px}.empty{padding:24px 16px;text-align:center;color:#8f9a9f}@media(max-width:420px){.grid{grid-template-columns:1fr}.visual{height:220px}.heroGif{height:290px}}
</style></head><body><main class="app"><header><div class="logo"><b>✣</b> FITPRO</div><div class="pill" id="total">Duke ngarkuar…</div></header><section class="hero"><small>FITPRO · SHQIP</small><h1>Biblioteka e ushtrimeve.</h1><p>Lista e ushtrimeve ngarkohet lokalisht; GIF-et lidhen direkt me <b>gif_url</b>.</p><div class="stats"><div class="stat"><b id="allCount">—</b><span class="muted">Ushtrime</span></div><div class="stat"><b id="shownCount">—</b><span class="muted">Rezultate</span></div><div class="stat"><b>LIVE</b><span class="muted">GIF</span></div></div></section><div class="note" id="note">Po ngarkohet exercises.json lokal…</div><section class="toolbar"><input class="search" id="search" placeholder="Kërko ushtrim, muskul ose pajisje..."></section><section class="section"><div class="chips" id="chips"></div></section><section><div class="grid" id="grid"></div><button class="more" id="more" style="display:none">Shfaq më shumë</button></section></main><nav class="bottom"><button class="active">⌂<br>Home</button><button>▣<br>Ushtrime</button><button>★<br>Ruajtura</button></nav><div class="sheet" id="sheet"><div class="panel"><button class="close" id="close">×</button><div class="heroGif"><img id="bigMedia" alt="GIF i ushtrimit"><div class="fallback" id="mediaFallback">Po ngarkohet...</div></div><h2 id="title"></h2><div class="box" id="info"></div><h3>Hapat</h3><ol class="steps" id="steps"></ol></div></div><script>
const COMMIT='7455efae41b330c265e7cd4b78dfa848e7ce5ebd';
const RAW=`https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/${COMMIT}/`;
const DATA='./exercises.json';
const GROUPS=['Të gjitha','Gjoks','Shpinë','Shpatulla','Krahë','Bark/Core','Këmbë sipër','Këmbë poshtë','Cardio','Parakrah','Qafë','Tjetër'];
const MAP={chest:'Gjoks',back:'Shpinë',shoulders:'Shpatulla','upper arms':'Krahë',waist:'Bark/Core','upper legs':'Këmbë sipër','lower legs':'Këmbë poshtë',cardio:'Cardio','lower arms':'Parakrah',neck:'Qafë'};
const $=id=>document.getElementById(id),state={group:'Të gjitha',q:'',list:[],page:24};
const clean=v=>String(v||'').trim(),groupOf=x=>MAP[clean(x.body_part||x.category).toLowerCase()]||'Tjetër',asset=p=>p?RAW+String(p).replace(/^\//,''):'';
function build(raw){return raw.filter(x=>x&&x.name&&x.gif_url).map(x=>({id:String(x.id),name:x.name,group:groupOf(x),target:clean(x.target),muscle:clean(x.muscle_group),equip:clean(x.equipment),gif:asset(x.gif_url),image:asset(x.image),steps:x.instruction_steps?.en||[],description:x.instructions?.en||''}));}
function filtered(){const q=state.q;return state.list.filter(x=>(state.group==='Të gjitha'||x.group===state.group)&&(!q||[x.name,x.group,x.target,x.muscle,x.equip].join(' ').toLowerCase().includes(q)));}
function chips(){$('chips').innerHTML=GROUPS.map(g=>`<button class="chip ${g===state.group?'active':''}" data-g="${g}">${g}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.group=b.dataset.g;state.page=24;chips();cards();});}
function card(x){return `<article class="card" data-id="${x.id}"><div class="visual"><img loading="lazy" src="${x.gif}" alt="${x.name}" onerror="if(this.dataset.fallback!=='1'&&'${x.image}'){this.dataset.fallback='1';this.src='${x.image}'}else{this.style.display='none';this.nextElementSibling.style.display='grid'}"><div class="fallback" style="display:none">Media nuk u ngarkua</div><span class="tag">${x.group}</span><span class="kind">GIF LIVE</span></div><div class="cardbody"><h3>${x.name}</h3><small>${x.target} · ${x.equip}</small><button class="btn">Shiko ushtrimin</button></div></article>`;}
function cards(){const list=filtered(),n=Math.min(state.page,list.length);$('shownCount').textContent=n;$('allCount').textContent=state.list.length.toLocaleString('en-US');$('total').textContent=`${state.list.length.toLocaleString('en-US')} ushtrime`;$('grid').innerHTML=list.length?list.slice(0,n).map(card).join(''):'<div class="empty">Nuk u gjet asnjë ushtrim.</div>';$('more').style.display=n<list.length?'block':'none';$('grid').querySelectorAll('.card').forEach(c=>c.onclick=()=>openItem(state.list.find(x=>x.id===c.dataset.id)));}
function openItem(x){if(!x)return;const img=$('bigMedia'),fb=$('mediaFallback');fb.style.display='grid';fb.textContent='Po ngarkohet GIF-i...';img.style.display='block';img.onload=()=>fb.style.display='none';img.onerror=()=>{if(img.dataset.fallback!=='1'&&x.image){img.dataset.fallback='1';img.src=x.image;return}img.style.display='none';fb.textContent='Media nuk u ngarkua'};img.dataset.fallback='0';img.src=x.gif;$('title').textContent=x.name;$('info').innerHTML=`<b class="accent">${x.group}</b><br>${x.target} · ${x.equip}${x.muscle?`<br>Muskuli: ${x.muscle}`:''}`;const s=x.steps.length?x.steps:(x.description?[x.description]:[]);$('steps').innerHTML=s.map(v=>`<li>${v}</li>`).join('');$('sheet').style.display='flex';document.body.classList.add('no-scroll');}
async function load(){try{const r=await fetch(DATA,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const raw=await r.json();if(!Array.isArray(raw)||!raw.length)throw new Error('JSON bosh');state.list=build(raw);$('note').textContent=`OK: ${state.list.length.toLocaleString('en-US')} ushtrime u lexuan nga exercises.json lokal.`;chips();cards();}catch(e){console.error(e);$('note').textContent=`Gabim në exercises.json lokal: ${e.message}`;$('total').textContent='Gabim';}}
$('close').onclick=()=>{$('sheet').style.display='none';document.body.classList.remove('no-scroll')};$('sheet').onclick=e=>{if(e.target===$('sheet'))$('close').onclick()};$('search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();state.page=24;cards()};$('more').onclick=()=>{state.page+=24;cards()};chips();load();
</script></body></html>
