<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FITPRO — Upper Body</title><style>*{box-sizing:border-box}body{margin:0;background:#05090b;color:#f5f7f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#081116,#030708);padding-bottom:90px}.top{padding:18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950;font-style:italic}.logo b{color:#adf22d}.pro{border:1px solid #334148;border-radius:12px;padding:8px 12px;font-weight:800}.hero{margin:0 16px 16px;padding:22px;border-radius:25px;background:radial-gradient(circle at 85% 15%,#2b3f11,#0b1418 53%);border:1px solid #1d2b31}.eyebrow{color:#adf22d;font-weight:900;font-size:11px;letter-spacing:1.2px}.hero h1{font-size:38px;line-height:1;margin:8px 0}.hero p,.meta{color:#919da2}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.sum{background:#ffffff0b;border:1px solid #ffffff0d;border-radius:13px;padding:10px}.sum b{display:block;font-size:17px}.sum small{color:#849095}.section{padding:7px 16px}.head{display:flex;justify-content:space-between;align-items:end;margin:12px 0}.head h2{margin:0;font-size:21px}.head span{color:#7f8b90;font-size:12px}.muscles{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.chip{border:1px solid #27343a;background:#0d1519;color:#cbd1d3;border-radius:99px;padding:9px 14px;white-space:nowrap;font-weight:750}.chip.active{background:#adf22d;color:#071005;border-color:#adf22d}.search{width:100%;margin:7px 0 12px;background:#0c1418;border:1px solid #233038;border-radius:14px;padding:13px 15px;color:#fff;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0c1317;border:1px solid #1c282e;border-radius:18px;overflow:hidden;cursor:pointer}.visual{height:178px;background:#fff;position:relative;overflow:hidden}.visual img{width:100%;height:100%;object-fit:contain}.placeholder{height:100%;display:grid;place-items:center;color:#586166;font-size:11px;text-align:center;padding:12px}.tag,.live{position:absolute;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:900}.tag{left:8px;top:8px;background:#adf22d;color:#071005}.live{right:7px;bottom:7px;background:#071005e8;color:#adf22d}.cardbody{padding:12px}.card h3{font-size:14px;margin:0 0 5px}.meta{font-size:10px;line-height:1.4}.start{margin-top:9px;width:100%;border:0;border-radius:10px;padding:9px;background:#172126;color:#adf22d;font-weight:850}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);height:72px;background:#081014ee;backdrop-filter:blur(15px);border-top:1px solid #1d292f;display:flex;justify-content:space-around;align-items:center;z-index:20}.nav{background:none;border:0;color:#78858a;font-size:10px}.nav b{display:block;font-size:19px}.nav.active{color:#adf22d}.sheet{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:flex-end;justify-content:center}.panel{width:min(680px,100%);max-height:95vh;overflow:auto;background:#091115;border-radius:27px 27px 0 0;padding:20px}.close{float:right;width:38px;height:38px;border:0;border-radius:50%;background:#182226;color:#fff;font-size:20px}.gifhero{height:350px;background:#fff;border-radius:20px;overflow:hidden;clear:both;margin-top:10px}.gifhero img{width:100%;height:100%;object-fit:contain}.panel h2{font-size:29px;margin:16px 0 6px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{background:#172126;padding:7px 10px;border-radius:99px;color:#bac2c5;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0}.stat{background:#10191d;border-radius:13px;padding:12px 5px;text-align:center}.stat small{display:block;color:#7f8a8f}.musclebox{padding:15px;background:#10191d;border-radius:16px;margin:15px 0}.musclebox b{color:#adf22d}.steps{padding:0;list-style:none;counter-reset:x}.steps li{counter-increment:x;display:flex;gap:12px;margin:14px 0;line-height:1.45}.steps li:before{content:counter(x);flex:0 0 28px;height:28px;border:1px solid #adf22d;color:#adf22d;border-radius:50%;display:grid;place-items:center;font-weight:900}.primary{width:100%;border:0;border-radius:14px;background:#adf22d;color:#081005;padding:15px;font-size:15px;font-weight:950}.credit{text-align:center;color:#68757a;font-size:10px;margin:24px}@media(max-width:390px){.visual{height:150px}.gifhero{height:290px}.hero h1{font-size:34px}}</style></head><body><main class="app"><header class="top"><div class="logo"><b>✣</b> FITPRO</div><div class="pro">♛ PRO</div></header><section class="hero"><div class="eyebrow">UPPER BODY · ANIMATED</div><h1>30 ushtrime.<br>Teknikë vizuale.</h1><p>Demonstrime të animuara për gjoks, shpinë, shpatulla dhe krahë.</p><div class="summary"><div class="sum"><b>30</b><small>Ushtrime</small></div><div class="sum"><b>4</b><small>Grupe</small></div><div class="sum"><b>GIF</b><small>Demo</small></div></div></section><section class="section"><div class="head"><h2>Biblioteka</h2><span id="resultCount"></span></div><input id="search" class="search" placeholder="Kërko ushtrim..."><div class="muscles" id="filters"></div></section><section class="section"><div class="grid" id="grid"></div></section><div class="credit">Exercise media powered by ExerciseDB / AscendAPI · non-commercial prototype</div></main><nav class="bottom"><button class="nav active"><b>⌂</b>Home</button><button class="nav"><b>▣</b>Workouts</button><button class="nav"><b>◉</b>Exercises</button><button class="nav"><b>▥</b>Progress</button></nav><div class="sheet" id="sheet"><div class="panel"><button class="close" id="close">×</button><div class="gifhero"><img id="demoGif" alt="Animated exercise"></div><h2 id="title"></h2><div class="badges" id="badges"></div><div class="stats"><div class="stat"><small>Sete</small><b id="sets"></b></div><div class="stat"><small>Përsëritje</small><b id="reps"></b></div><div class="stat"><small>Pushim</small><b id="rest"></b></div></div><div class="musclebox"><small>Muskujt kryesorë</small><br><b id="worked"></b></div><h3>Teknika</h3><ol class="steps" id="steps"></ol><button class="primary" id="complete">✓ Përfundo setin</button></div></div><script>const specs=[['Bench Press','barbell bench press','Gjoks','Gjoks · Triceps · Deltoid anterior'],['Incline Dumbbell Press','incline dumbbell press','Gjoks','Gjoksi i sipërm · Triceps · Shpatulla'],['Dumbbell Bench Press','dumbbell bench press','Gjoks','Gjoks · Triceps · Shpatulla'],['Dumbbell Fly','dumbbell fly','Gjoks','Gjoks · Deltoid anterior'],['Cable Crossover','cable crossover','Gjoks','Gjoks'],['Push-Up','push up','Gjoks','Gjoks · Triceps · Core'],['Chest Dip','chest dip','Gjoks','Gjoks · Triceps'],['Pull-Up','pull up','Shpinë','Lats · Biceps · Shpina e sipërme'],['Chin-Up','chin up','Shpinë','Lats · Biceps'],['Lat Pulldown','lat pulldown','Shpinë','Lats · Biceps'],['Seated Cable Row','seated cable row','Shpinë','Shpina e mesme · Lats · Biceps'],['Barbell Bent Over Row','barbell bent over row','Shpinë','Lats · Rhomboids · Biceps'],['One Arm Dumbbell Row','one arm dumbbell row','Shpinë','Lats · Shpina e mesme'],['Straight Arm Pulldown','straight arm pulldown','Shpinë','Lats'],['Face Pull','face pull','Shpinë','Rear deltoids · Upper back'],['Overhead Press','barbell overhead press','Shpatulla','Deltoids · Triceps'],['Dumbbell Shoulder Press','dumbbell shoulder press','Shpatulla','Deltoids · Triceps'],['Arnold Press','arnold press','Shpatulla','Deltoids · Triceps'],['Lateral Raise','dumbbell lateral raise','Shpatulla','Deltoid lateral'],['Front Raise','dumbbell front raise','Shpatulla','Deltoid anterior'],['Reverse Fly','dumbbell reverse fly','Shpatulla','Rear deltoid · Upper back'],['Upright Row','upright row','Shpatulla','Deltoids · Traps'],['Dumbbell Biceps Curl','dumbbell biceps curl','Krahë','Biceps · Brachialis'],['Hammer Curl','hammer curl','Krahë','Brachialis · Biceps · Forearms'],['Preacher Curl','preacher curl','Krahë','Biceps'],['Concentration Curl','concentration curl','Krahë','Biceps'],['Triceps Pushdown','triceps pushdown','Krahë','Triceps'],['Overhead Triceps Extension','overhead triceps extension','Krahë','Triceps'],['Skull Crusher','skull crusher','Krahë','Triceps'],['Close Grip Bench Press','close grip bench press','Krahë','Triceps · Gjoks']];const data=specs.map((s,i)=>({name:s[0],query:s[1],group:s[2],muscles:s[3],sets:i%5===0?'4':'3',reps:i%4===0?'6–10':i%3===0?'12–15':'8–12',rest:i%4===0?'90s':'60s',steps:['Vendosu në pozicion stabil dhe ruaj shtyllën kurrizore neutrale.','Nise lëvizjen me kontroll dhe mbaj tension te muskujt kryesorë.','Përfundo amplitudën pa hov ose lëkundje të panevojshme.','Kthehu ngadalë në pozicionin fillestar.']}));data[0].gif='https://static.exercisedb.dev/media/EIeI8Vf.gif';let filter='Të gjitha',term='';const groups=['Të gjitha','Gjoks','Shpinë','Shpatulla','Krahë'];const grid=document.getElementById('grid'),sheet=document.getElementById('sheet'),filters=document.getElementById('filters'),resultCount=document.getElementById('resultCount');function unwrap(j){if(Array.isArray(j))return j;if(Array.isArray(j.data))return j.data;if(j.data&&Array.isArray(j.data.exercises))return j.data.exercises;if(Array.isArray(j.results))return j.results;if(Array.isArray(j.exercises))return j.exercises;return[]}function renderFilters(){filters.innerHTML=groups.map(x=>`<button class="chip ${x===filter?'active':''}" data-filter="${x}">${x}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderFilters();render()})}function visible(){return data.filter(x=>(filter==='Të gjitha'||x.group===filter)&&x.name.toLowerCase().includes(term))}function render(){const list=visible();resultCount.textContent=list.length+' ushtrime';grid.innerHTML=list.map(x=>`<article class="card" data-name="${x.name}"><div class="visual">${x.gif?`<img src="${x.gif}" alt="${x.name}" loading="lazy" referrerpolicy="no-referrer">`:`<div class="placeholder">GIF duke u lidhur...</div>`}<span class="tag">${x.group}</span><span class="live">● ANIMATED</span></div><div class="cardbody"><h3>${x.name}</h3><div class="meta">${x.muscles}</div><button class="start">Shiko lëvizjen</button></div></article>`).join('');grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>openEx(c.dataset.name))}async function findGif(x){if(x.gif)return x.gif;try{const url='https://oss.exercisedb.dev/api/v1/exercises/search?q='+encodeURIComponent(x.query);const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)return null;const list=unwrap(await r.json());const exact=list.find(v=>String(v.name||'').toLowerCase()===x.query.toLowerCase());const hit=exact||list.find(v=>v.gifUrl);if(hit&&hit.gifUrl){x.gif=hit.gifUrl;return x.gif}}catch(e){console.warn('ExerciseDB request failed',x.query,e)}return null}async function loadAll(){render();for(let i=0;i<data.length;i++){await findGif(data[i]);if(i%3===2||i===data.length-1)render();await new Promise(r=>setTimeout(r,120))}}async function openEx(name){const x=data.find(v=>v.name===name);sheet.style.display='flex';document.body.style.overflow='hidden';title.textContent=x.name;badges.innerHTML=`<span class="badge">${x.group}</span><span class="badge">Animated demo</span>`;sets.textContent=x.sets;reps.textContent=x.reps;rest.textContent=x.rest;worked.textContent=x.muscles;steps.innerHTML=x.steps.map(s=>`<li>${s}</li>`).join('');demoGif.removeAttribute('src');const gif=await findGif(x);if(gif)demoGif.src=gif;complete.textContent='✓ Përfundo setin'}document.getElementById('search').oninput=e=>{term=e.target.value.trim().toLowerCase();render()};close.onclick=()=>{sheet.style.display='none';document.body.style.overflow=''};sheet.onclick=e=>{if(e.target===sheet)close.onclick()};complete.onclick=()=>complete.textContent='✓ Seti u regjistrua';renderFilters();loadAll();</script></body></html>
