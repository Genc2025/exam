<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FITPRO — Upper Body</title><style>*{box-sizing:border-box}body{margin:0;background:#050a0d;color:#f7f8f8;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#071015,#030709);padding-bottom:88px}.top{padding:18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950;font-style:italic}.logo b{color:#a9ef27}.pro{border:1px solid #344149;border-radius:12px;padding:8px 12px;font-weight:800}.hero{margin:0 16px 16px;padding:22px;border-radius:24px;background:radial-gradient(circle at 80% 20%,#27380f,#0b1418 52%);border:1px solid #1c292f}.eyebrow{color:#a9ef27;font-weight:800;font-size:12px;letter-spacing:1px}.hero h1{font-size:36px;line-height:.98;margin:8px 0}.hero p,.meta{color:#96a0a5}.section{padding:8px 16px}.head{display:flex;justify-content:space-between;align-items:end;margin:10px 0 13px}.head h2{margin:0;font-size:21px}.head span{color:#7f8b90;font-size:12px}.muscles{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.chip{border:1px solid #27343a;background:#0d1519;color:#cbd1d3;border-radius:99px;padding:9px 14px;white-space:nowrap;font-weight:750}.chip.active{background:#a9ef27;color:#081005;border-color:#a9ef27}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0c1317;border:1px solid #1c282e;border-radius:18px;overflow:hidden;cursor:pointer}.visual{height:165px;background:#fff;position:relative;overflow:hidden}.visual img{width:100%;height:100%;object-fit:contain}.tag{position:absolute;left:9px;top:9px;background:#a9ef27;color:#071005;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:900}.phase{position:absolute;right:8px;bottom:7px;background:#071005d9;color:#fff;padding:5px 7px;border-radius:8px;font-size:9px}.cardbody{padding:12px}.card h3{font-size:15px;margin:0 0 5px}.meta{font-size:11px;line-height:1.35}.start{margin-top:10px;width:100%;border:0;border-radius:10px;padding:9px;background:#172126;color:#a9ef27;font-weight:850}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:72px;background:#081014ee;backdrop-filter:blur(15px);border-top:1px solid #1d292f;display:flex;justify-content:space-around;align-items:center;z-index:20}.nav{background:none;border:0;color:#78858a;font-size:11px}.nav b{display:block;font-size:20px}.nav.active{color:#a9ef27}.sheet{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:flex-end;justify-content:center}.panel{width:min(620px,100%);max-height:94vh;overflow:auto;background:#091115;border-radius:26px 26px 0 0;padding:20px}.close{float:right;width:38px;height:38px;border:0;border-radius:50%;background:#182226;color:#fff;font-size:20px;position:relative;z-index:2}.demo{display:grid;grid-template-columns:1fr 1fr;gap:7px;clear:both;padding-top:10px}.demofigure{background:#fff;border-radius:17px;overflow:hidden;position:relative;height:245px}.demofigure img{width:100%;height:100%;object-fit:contain}.demolabel{position:absolute;bottom:8px;left:8px;background:#071005e8;border-radius:8px;padding:6px 9px;font-size:10px;font-weight:900}.panel h2{font-size:28px;margin:17px 0 5px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{background:#172126;padding:7px 10px;border-radius:99px;color:#b8c0c3;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#10191d;border-radius:13px;padding:12px 5px;text-align:center}.stat small{display:block;color:#7f8a8f}.musclebox{padding:15px;background:#10191d;border-radius:16px;margin:15px 0}.musclebox b{color:#a9ef27}.steps{padding:0;list-style:none;counter-reset:x}.steps li{counter-increment:x;display:flex;gap:12px;margin:15px 0;line-height:1.45;color:#d9dddf}.steps li:before{content:counter(x);flex:0 0 28px;height:28px;border:1px solid #a9ef27;color:#a9ef27;border-radius:50%;display:grid;place-items:center;font-weight:900}.primary{width:100%;border:0;border-radius:14px;background:#a9ef27;color:#081005;padding:15px;font-size:15px;font-weight:950;margin-top:10px}@media(max-width:390px){.visual{height:145px}.demofigure{height:205px}}</style></head><body><main class="app"><header class="top"><div class="logo"><b>✣</b> FITPRO</div><div class="pro">♛ PRO</div></header><section class="hero"><div class="eyebrow">UPPER BODY PROGRAM</div><h1>Ndërto<br>forcën lart.</h1><p>Gjoks · Shpinë · Shpatulla · Krahë</p></section><section class="section"><div class="head"><h2>Grupet muskulore</h2><span>Upper Body</span></div><div class="muscles" id="filters"></div></section><section class="section"><div class="head"><h2>Ushtrimet</h2><span id="resultCount"></span></div><div class="grid" id="grid"></div></section></main><nav class="bottom"><button class="nav active"><b>⌂</b>Home</button><button class="nav"><b>▣</b>Workouts</button><button class="nav"><b>◉</b>Exercises</button><button class="nav"><b>▥</b>Progress</button></nav><div class="sheet" id="sheet"><div class="panel"><button class="close" id="close">×</button><div class="demo"><div class="demofigure"><img id="img0"><span class="demolabel">START</span></div><div class="demofigure"><img id="img1"><span class="demolabel">END</span></div></div><h2 id="title"></h2><div class="badges" id="badges"></div><div class="stats"><div class="stat"><small>Sete</small><b id="sets"></b></div><div class="stat"><small>Përsëritje</small><b id="reps"></b></div><div class="stat"><small>Pushim</small><b id="rest"></b></div></div><div class="musclebox"><small>Muskujt kryesorë</small><br><b id="worked"></b></div><h3>Teknika</h3><ol class="steps" id="steps"></ol><button class="primary" id="complete">✓ Përfundo setin</button></div></div><script>const base='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';const data=[{name:'Bench Press',group:'Gjoks',id:'Barbell_Bench_Press_-_Medium_Grip',muscles:'Gjoks · Triceps · Shpatulla e përparme',sets:'3–4',reps:'6–12',rest:'60–90s',level:'Mesatar',steps:['Shtrihu në bankë me shputat të vendosura fort në dysheme.','Stabilizo shpatullat prapa dhe poshtë dhe kap shufrën pak më gjerë se shpatullat.','Ule shufrën me kontroll drejt kraharorit.','Shtyje përsëri lart duke ruajtur pozicionin e trungut.']},{name:'Incline Dumbbell Press',group:'Gjoks',id:'Incline_Dumbbell_Press',muscles:'Gjoksi i sipërm · Triceps · Deltoid anterior',sets:'3',reps:'8–12',rest:'60–90s',level:'Mesatar',steps:['Vendose bankën në pjerrësi të moderuar.','Nis me hantelat anash kraharorit dhe shpatullat të stabilizuara.','Shtyji hantelat lart me kontroll.','Uli ngadalë në pozicionin fillestar.']},{name:'Pull-Up',group:'Shpinë',id:'Pullups',muscles:'Latissimus dorsi · Biceps · Shpina e sipërme',sets:'3–4',reps:'5–10',rest:'90s',level:'Mesatar',steps:['Kap shufrën pak më gjerë se shpatullat.','Aktivizo shpatullat para se të përkulësh bërrylat.','Tërhiq trupin lart drejt shufrës.','Ulu me kontroll deri në zgjatje të plotë.']},{name:'Seated Cable Row',group:'Shpinë',id:'Seated_Cable_Rows',muscles:'Shpina e mesme · Lats · Biceps',sets:'3',reps:'8–12',rest:'60–90s',level:'Lehtë',steps:['Ulu me shtyllën neutrale dhe gjunjët lehtë të përkulur.','Tërhiq shpatullat prapa dhe sill bërrylat pranë trungut.','Tërhiq dorezën drejt pjesës së poshtme të brinjëve.','Ktheje peshën ngadalë në start.']},{name:'Overhead Press',group:'Shpatulla',id:'Standing_Military_Press',muscles:'Deltoids · Triceps',sets:'3–4',reps:'6–10',rest:'90s',level:'Mesatar',steps:['Qëndro stabil me trungun të tendosur.','Mbaje shufrën në nivelin e sipërm të kraharorit.','Shtyje vertikalisht mbi kokë pa e ekzagjeruar harkun e mesit.','Ule me kontroll në pozicionin fillestar.']},{name:'Lateral Raise',group:'Shpatulla',id:'Side_Lateral_Raise',muscles:'Deltoid lateral',sets:'3',reps:'12–15',rest:'45–60s',level:'Lehtë',steps:['Mbaji hantelat anash dhe bërrylat lehtë të përkulur.','Ngriji krahët anash me kontroll.','Ndalo afërsisht në nivelin e shpatullave.','Uli ngadalë pa humbur tensionin.']},{name:'Biceps Curl',group:'Krahë',id:'Dumbbell_Bicep_Curl',muscles:'Biceps brachii · Brachialis',sets:'3',reps:'10–15',rest:'45–60s',level:'Lehtë',steps:['Qëndro drejt me bërrylat pranë trungut.','Ngriji peshat duke përkulur vetëm bërrylat.','Shtrëngo bicepsin në pjesën e sipërme.','Uli peshat ngadalë në zgjatje.']},{name:'Triceps Pushdown',group:'Krahë',id:'Triceps_Pushdown',muscles:'Triceps brachii',sets:'3',reps:'10–15',rest:'45–60s',level:'Lehtë',steps:['Mbaji bërrylat pranë trungut.','Shtyje dorezën poshtë duke zgjatur bërrylat.','Shtrëngo tricepsin në fund të lëvizjes.','Ktheje peshën me kontroll pa lëvizur bërrylat.']}];data.forEach(x=>{x.images=[base+x.id+'/0.jpg',base+x.id+'/1.jpg']});let filter='Të gjitha';const filterNames=['Të gjitha','Gjoks','Shpinë','Shpatulla','Krahë'];const grid=document.getElementById('grid'),sheet=document.getElementById('sheet');function renderFilters(){filters.innerHTML=filterNames.map(x=>`<button class="chip ${x===filter?'active':''}" onclick="filter='${x}';renderFilters();render()">${x}</button>`).join('')}function render(){const list=data.filter(x=>filter==='Të gjitha'||x.group===filter);resultCount.textContent=list.length+' ushtrime';grid.innerHTML=list.map(x=>`<article class="card" onclick="openEx('${x.name}')"><div class="visual"><img src="${x.images[0]}" alt="${x.name}" loading="lazy"><span class="tag">${x.group}</span><span class="phase">START → END</span></div><div class="cardbody"><h3>${x.name}</h3><div class="meta">${x.muscles}</div><button class="start">Shiko demonstrimin</button></div></article>`).join('')}function openEx(name){const x=data.find(v=>v.name===name);img0.src=x.images[0];img1.src=x.images[1];img0.alt=x.name+' start';img1.alt=x.name+' end';title.textContent=x.name;badges.innerHTML=`<span class="badge">${x.group}</span><span class="badge">${x.level}</span>`;sets.textContent=x.sets;reps.textContent=x.reps;rest.textContent=x.rest;worked.textContent=x.muscles;steps.innerHTML=x.steps.map(s=>`<li>${s}</li>`).join('');sheet.style.display='flex';document.body.style.overflow='hidden';complete.textContent='✓ Përfundo setin'}close.onclick=()=>{sheet.style.display='none';document.body.style.overflow=''};sheet.onclick=e=>{if(e.target===sheet)close.onclick()};complete.onclick=()=>complete.textContent='✓ Seti u regjistrua';renderFilters();render();</script></body></html>
