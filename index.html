const COMMIT='7455efae41b330c265e7cd4b78dfa848e7ce5ebd',RAW=`https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/${COMMIT}/`,DATA='./exercises.json';const GROUPS=['Të gjitha','Gjoks','Shpinë','Shpatulla','Krahë','Bark/Core','Këmbë sipër','Këmbë poshtë','Cardio','Parakrah','Qafë','Tjetër'],MAP={chest:'Gjoks',back:'Shpinë',shoulders:'Shpatulla','upper arms':'Krahë',waist:'Bark/Core','upper legs':'Këmbë sipër','lower legs':'Këmbë poshtë',cardio:'Cardio','lower arms':'Parakrah',neck:'Qafë'};const $=id=>document.getElementById(id),state={group:'Të gjitha',q:'',list:[],page:24,savedOnly:false,current:null},saved=new Set(JSON.parse(localStorage.getItem('kp-saved')||'[]'));const clean=v=>String(v||'').trim(),groupOf=x=>MAP[clean(x.body_part||x.category).toLowerCase()]||'Tjetër',asset=p=>p?RAW+String(p).replace(/^\//,''):'';

async function load(){try{const r=await fetch(DATA);if(!r.ok)throw Error(`HTTP ${r.status}`);const raw=await r.json();if(!Array.isArray(raw)||!raw.length)throw Error('JSON bosh');state.list=build(raw);renderChips();render();$('offlineLabel').textContent=`${saved.size} ushtrime të ruajtura`}catch(e){$('resultLabel').textContent='GABIM';$('grid').innerHTML=`<div class="empty">Gabim në exercises.json: ${e.message}</div>`}}async function downloadAll(){if(!navigator.serviceWorker?.controller){$('progressText').textContent='Service Worker po aktivizohet. Hape app-in përsëri.';return}const urls=[...new Set(state.list.map(x=>x.gif).filter(Boolean))];if(!urls.length)return;$('download').disabled=true;$('progress').style.display='block';const ch=new MessageChannel();ch.port1.onmessage=e=>{const d=e.data;if(d.type==='progress'||d.type==='complete'){const pct=d.total?Math.round((d.done+d.failed)/d.total*100):0;$('bar').style.width=pct+'%';$('progressText').textContent=`${d.done} ruajtur · ${d.failed} dështuan · ${pct}%`}if(d.type==='complete'){$('download').disabled=false;$('offlineLabel').textContent=`Offline: ${d.done} GIF`}};navigator.serviceWorker.controller.postMessage({type:'CACHE_GIFS',urls},[ch.port2])}function showSaved(){state.savedOnly=true;state.page=24;state.group='Të gjitha';renderChips();render();document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));$('savedNav').classList.add('active');window.scrollTo({top:520,behavior:'smooth'})}function showAll(){state.savedOnly=false;state.page=24;render();document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));$('libraryNav').classList.add('active');window.scrollTo({top:520,behavior:'smooth'})}function net(){$('net').textContent=navigator.onLine?'ONLINE':'OFFLINE';$('net').style.color=navigator.onLine?'#d8bd6c':'#e69b5b'}
window.addEventListener('online',net);window.addEventListener('offline',net);$('download').onclick=downloadAll;$('favoritesBtn').onclick=showSaved;$('savedNav').onclick=showSaved;$('libraryNav').onclick=showAll;$('homeNav').onclick=()=>{state.savedOnly=false;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));$('homeNav').classList.add('active');render();window.scrollTo({top:0,behavior:'smooth'})};$('favorite').onclick=toggleFav;$('close').onclick=()=>{$('sheet').style.display='none';document.body.classList.remove('lock')};$('sheet').onclick=e=>{if(e.target===$('sheet'))$('close').onclick()};$('search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();state.page=24;render()};$('more').onclick=()=>{state.page+=24;render()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(console.error);net();renderChips();load();
