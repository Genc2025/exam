<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USA Core Sergeant Question Bank</title><script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf0f7;font:15px Inter,system-ui,Arial}.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}aside{background:#0b1728;border-right:1px solid #203149;padding:28px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:20px}.brand span{display:block;color:#7f95ad;font-size:12px;margin-top:5px}.count{margin:30px 0;padding:20px;border:1px solid #243750;border-radius:16px;background:#101f33}.count b{font-size:32px;display:block}.count small{color:#8fa3b8}label{display:block;color:#8fa3b8;font-size:12px;font-weight:700;margin:18px 0 7px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #2a3d56;background:#0a1525;color:#fff}button{cursor:pointer;font-weight:800;background:#18365a}.upload{margin-top:22px;border:1px dashed #355270;padding:16px;border-radius:12px;color:#9fb0c1;font-size:12px}main{padding:38px;max-width:1200px;width:100%;margin:auto}header{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:28px}h1{font-size:38px;margin:5px 0}.eyebrow{color:#55a7ff;font-weight:900;font-size:11px;letter-spacing:1.8px}.sub{color:#8fa3b8;max-width:700px}.card{background:#0c192a;border:1px solid #203149;border-radius:18px;padding:24px;margin-bottom:18px}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:11px;padding:5px 9px;border-radius:20px;background:#142a45;color:#9fc7ef}.qid{color:#5caaff;font-weight:900}.q{font-size:19px;line-height:1.45;font-weight:750;margin:18px 0}.option{padding:12px 14px;border:1px solid #223650;border-radius:10px;margin:8px 0;color:#c9d5e2}.option.correct{border-color:#2e8b68;background:#0d3029;color:#bff5df}.section{margin-top:18px;padding-top:16px;border-top:1px solid #1e3047}.section b{display:block;color:#76b8ff;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.section p{margin:0;color:#b7c5d4;line-height:1.55}.source{color:#91a7bc;font-size:13px}.empty{text-align:center;padding:70px;color:#8094aa}.pager{display:flex;gap:10px;margin:25px 0}.pager button{max-width:130px}.status{color:#8fa3b8}@media(max-width:800px){.app{display:block}aside{position:relative;height:auto}.app main{padding:22px}header{display:block}h1{font-size:29px}}</style></head><body><div class="app"><aside><div class="brand">USA CORE<span>POLICE SERGEANT ACADEMY</span></div><div class="count"><b id="total">0</b><small>questions loaded</small></div><label>SEARCH</label><input id="search" placeholder="Question, QID, topic..."><label>TOPIC</label><select id="topic"><option value="">All topics</option></select><label>DIFFICULTY</label><select id="difficulty"><option value="">All levels</option></select><button id="reset" style="margin-top:18px">Reset filters</button><div class="upload"><b>Question Bank</b><br><span id="fileStatus">Loading bundled database…</span><input id="file" type="file" accept=".db,.sqlite,.sqlite3" style="margin-top:12px"></div></aside><main><header><div><div class="eyebrow">VERIFIED PROMOTIONAL EXAM PREP</div><h1>USA Core Police Sergeant</h1><div class="sub">Complete question detail: answer choices, correct answer, rationale, official source locator and evidence excerpt.</div></div><div class="status"><b id="showing">0</b> showing</div></header><div id="list"></div><div id="empty" class="empty" hidden>No matching questions.</div><div class="pager"><button id="prev">Previous</button><button id="next">Next</button></div></main></div><script>let all=[],filtered=[],page=0;const per=25,$=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadBytes(bytes,name){const SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+f});const db=new SQL.Database(new Uint8Array(bytes));const q=`SELECT id,qid,topic,difficulty,question,option_a,option_b,option_c,option_d,correct_option,rationale,source_title,source_locator,evidence_excerpt FROM questions ORDER BY id`;const r=db.exec(q)[0];if(!r)throw Error('questions table not found');all=r.values.map(v=>Object.fromEntries(r.columns.map((c,i)=>[c,v[i]])));$('fileStatus').textContent=name+' · '+all.length+' questions';$('total').textContent=all.length.toLocaleString();fillFilters();apply()}async function bundled(){try{const r=await fetch('USA_CORE_Q001_Q1300_FINAL_CLEAN_EVIDENCE_FIXED.db');if(!r.ok)throw Error();await loadBytes(await r.arrayBuffer(),'Bundled final DB')}catch(e){$('fileStatus').textContent='Bundled DB not found — select the final .db file below.'}}function fillFilters(){for(const [id,key] of [['topic','topic'],['difficulty','difficulty']]){const s=$(id),old=s.value;s.innerHTML='<option value="">All '+id+'s</option>'+[...new Set(all.map(x=>x[key]).filter(Boolean))].sort().map(v=>`<option>${esc(v)}</option>`).join('');s.value=old}}function apply(){const s=$('search').value.trim().toLowerCase(),t=$('topic').value,d=$('difficulty').value;filtered=all.filter(x=>(!s||[x.qid,x.topic,x.question,x.rationale,x.source_title].some(v=>String(v||'').toLowerCase().includes(s)))&&(!t||x.topic===t)&&(!d||x.difficulty===d));page=0;render()}function render(){const start=page*per,items=filtered.slice(start,start+per);$('showing').textContent=filtered.length.toLocaleString();$('empty').hidden=items.length>0;$('list').innerHTML=items.map(x=>{const opts=['A','B','C','D'].map(k=>`<div class="option ${x.correct_option===k?'correct':''}"><b>${k}.</b> ${esc(x['option_'+k.toLowerCase()])}${x.correct_option===k?' <b>✓ Correct</b>':''}</div>`).join('');return `<article class="card"><div class="meta"><span class="qid">${esc(x.qid)}</span><span class="pill">${esc(x.topic)}</span><span class="pill">${esc(x.difficulty)}</span></div><div class="q">${esc(x.question)}</div>${opts}<div class="section"><b>Rationale</b><p>${esc(x.rationale)}</p></div><div class="section"><b>Official Source</b><p class="source">${esc(x.source_title)} · ${esc(x.source_locator)}</p></div><div class="section"><b>Evidence</b><p>${esc(x.evidence_excerpt)}</p></div></article>`}).join('');$('prev').disabled=page===0;$('next').disabled=start+per>=filtered.length;scrollTo({top:0,behavior:'smooth'})}$('file').onchange=async e=>{const f=e.target.files[0];if(f)try{await loadBytes(await f.arrayBuffer(),f.name)}catch(err){$('fileStatus').textContent='Could not read database: '+err.message}};$('search').oninput=apply;$('topic').onchange=apply;$('difficulty').onchange=apply;$('reset').onclick=()=>{$('search').value='';$('topic').value='';$('difficulty').value='';apply()};$('prev').onclick=()=>{if(page){page--;render()}};$('next').onclick=()=>{if((page+1)*per<filtered.length){page++;render()}};bundled();</script></body></html>
