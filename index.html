<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sky Runner</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}#game{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-around;color:white;font-weight:900;text-shadow:2px 2px #000;pointer-events:none}.controls{position:fixed;left:18px;right:18px;bottom:20px;display:flex;justify-content:space-between;touch-action:none}.pad{display:flex;gap:12px}.btn{width:68px;height:68px;border-radius:50%;border:2px solid #ffffff88;background:#1118;color:white;font-size:30px;font-weight:bold;user-select:none;-webkit-user-select:none}.jump{width:82px;height:82px;background:#e34b35bb}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;color:#fff;text-align:center}.panel{background:#151515dd;border:2px solid #fff3;padding:28px;border-radius:18px;max-width:360px}.panel h1{margin:0 0 8px;font-size:38px}.panel p{line-height:1.45;color:#ddd}.panel button{border:0;border-radius:10px;background:#e34b35;color:#fff;font-weight:900;padding:14px 25px;font-size:17px}@media(min-width:900px){.controls{opacity:.45}.btn{width:62px;height:62px}.jump{width:74px;height:74px}}</style></head><body><canvas id="game"></canvas><div class="hud"><span id="score">SCORE 0000</span><span id="coins">GEMS 0</span><span id="lives">LIVES 3</span></div><div class="controls"><div class="pad"><button class="btn" data-key="left">◀</button><button class="btn" data-key="right">▶</button></div><button class="btn jump" data-key="jump">▲</button></div><div class="overlay" id="overlay"><div class="panel"><h1>SKY RUNNER</h1><p>An original side-scrolling platform adventure. Run, jump, collect gems and reach the beacon.</p><p>Keyboard: A/D or arrows · Space to jump</p><button id="start">START GAME</button></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,scale=1;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;scale=devicePixelRatio;x.setTransform(scale,0,0,scale,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const keys={left:false,right:false,jump:false};addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w')keys.jump=true});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w')keys.jump=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;['pointerdown'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=true}));['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false}))});
const world={w:5200,ground:520};let player,platforms,gems,enemies,score,lives,camera,running,lastJump=false;
function reset(full=true){player={x:100,y:380,w:34,h:46,vx:0,vy:0,on:false,inv:0};camera=0;if(full){score=0;lives=3}platforms=[{x:0,y:520,w:900,h:100},{x:1010,y:520,w:760,h:100},{x:1870,y:520,w:820,h:100},{x:2810,y:520,w:950,h:100},{x:3890,y:520,w:1310,h:100},{x:350,y:410,w:150,h:24},{x:620,y:340,w:150,h:24},{x:1130,y:390,w:180,h:24},{x:1450,y:320,w:160,h:24},{x:1990,y:400,w:170,h:24},{x:2290,y:325,w:150,h:24},{x:2940,y:390,w:170,h:24},{x:3260,y:310,w:170,h:24},{x:4050,y:395,w:170,h:24},{x:4440,y:320,w:180,h:24}];gems=[420,690,1200,1515,2060,2350,3010,3330,4120,4510,4770].map((a,i)=>({x:a,y:i%2?275:360,t:0,taken:false}));enemies=[{x:720,y:480,d:1,min:650,max:850},{x:1320,y:480,d:-1,min:1100,max:1680},{x:2130,y:480,d:1,min:1900,max:2600},{x:3100,y:480,d:-1,min:2850,max:3700},{x:4300,y:480,d:1,min:3920,max:4850}];updateHud()}
function updateHud(){scoreEl.textContent='SCORE '+String(score).padStart(4,'0');coinsEl.textContent='GEMS '+gems.filter(g=>g.taken).length;livesEl.textContent='LIVES '+lives}const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),livesEl=document.getElementById('lives');
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function respawn(){lives--;if(lives<=0){running=false;overlay.style.display='flex';overlay.querySelector('h1').textContent='GAME OVER';overlay.querySelector('p').textContent='Score: '+score;start.textContent='TRY AGAIN';reset(true);return}player.x=Math.max(80,camera+80);player.y=300;player.vx=player.vy=0;player.inv=90;updateHud()}
function update(){if(!running)return;let accel=.65,max=6.3;if(keys.left)player.vx-=accel;if(keys.right)player.vx+=accel;if(!keys.left&&!keys.right)player.vx*=.78;player.vx=Math.max(-max,Math.min(max,player.vx));if(keys.jump&&!lastJump&&player.on){player.vy=-13.2;player.on=false}lastJump=keys.jump;player.vy+=.68;player.vy=Math.min(player.vy,16);let oldY=player.y;player.x+=player.vx;player.x=Math.max(0,Math.min(world.w-player.w,player.x));player.y+=player.vy;player.on=false;for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.on=true}}if(player.y>H+200)respawn();for(const g of gems){g.t+=.08;if(!g.taken&&Math.hypot(player.x+17-g.x,player.y+23-g.y)<38){g.taken=true;score+=100;updateHud()}}for(const e of enemies){e.x+=e.d*1.4;if(e.x<e.min||e.x>e.max)e.d*=-1;let box={x:e.x,y:e.y,w:38,h:40};if(hit(player,box)&&player.inv<=0){if(player.vy>2&&oldY+player.h<=e.y+10){score+=200;e.y=1000;player.vy=-8;updateHud()}else respawn()}}if(player.inv>0)player.inv--;if(player.x>5030){score+=1000;running=false;overlay.style.display='flex';overlay.querySelector('h1').textContent='LEVEL CLEAR';overlay.querySelector('p').textContent='Final score: '+score;start.textContent='PLAY AGAIN'}camera+=(Math.max(0,Math.min(world.w-W,player.x-W*.36))-camera)*.09}
function draw(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#55b9ef');sky.addColorStop(1,'#d8f4ff');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#ffffffbb';for(let i=0;i<12;i++){let cx=((i*470-camera*.18)%6000)-100;x.beginPath();x.arc(cx,100+(i%4)*55,34,0,7);x.arc(cx+35,105+(i%4)*55,48,0,7);x.arc(cx+78,100+(i%4)*55,30,0,7);x.fill()}x.save();x.translate(-camera,0);x.fillStyle='#6cbf4b';for(const p of platforms){x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#49311f';x.fillRect(p.x,p.y+18,p.w,p.h-18);x.fillStyle='#6cbf4b'}for(const g of gems)if(!g.taken){let r=12+Math.sin(g.t)*2;x.fillStyle='#ffd43b';x.beginPath();x.moveTo(g.x,g.y-r);x.lineTo(g.x+r,g.y);x.lineTo(g.x,g.y+r);x.lineTo(g.x-r,g.y);x.closePath();x.fill();x.strokeStyle='#fff4a3';x.lineWidth=3;x.stroke()}for(const e of enemies)if(e.y<800){x.fillStyle='#7048a8';x.fillRect(e.x,e.y,38,34);x.fillStyle='#fff';x.fillRect(e.x+7,e.y+7,7,8);x.fillRect(e.x+24,e.y+7,7,8);x.fillStyle='#111';x.fillRect(e.x+10,e.y+9,3,4);x.fillRect(e.x+27,e.y+9,3,4)}x.fillStyle='#ff7a35';x.fillRect(5070,300,18,220);x.fillStyle='#fff';x.beginPath();x.moveTo(5088,310);x.lineTo(5160,340);x.lineTo(5088,370);x.fill();if(player.inv%10<5){x.fillStyle='#1d4ed8';x.fillRect(player.x,player.y+12,player.w,34);x.fillStyle='#f1b27d';x.fillRect(player.x+5,player.y,24,20);x.fillStyle='#0d2f72';x.fillRect(player.x+2,player.y-3,30,8);x.fillStyle='#fff';x.fillRect(player.x+20,player.y+6,5,5)}x.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}reset(true);loop();const overlay=document.getElementById('overlay'),start=document.getElementById('start');start.onclick=()=>{reset(true);overlay.style.display='none';running=true};
</script></body></html>
